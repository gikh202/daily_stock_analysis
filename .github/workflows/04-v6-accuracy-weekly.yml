name: V6 准确率研究周报

on:
  schedule:
    # 每周日 UTC 23:30（北京时间周一 07:30），使用最近一次生产历史 Cache 做离线研究。
    - cron: '30 23 * * 0'
  workflow_dispatch:
    inputs:
      codes:
        description: '可选：逗号分隔标的；留空则回放数据库中的全部非基准标的'
        required: false
        default: ''
        type: string
      min_samples:
        description: '统计结果最小样本门槛'
        required: false
        default: '50'
        type: string
      promotion_min_samples:
        description: 'Challenger 晋级研究所需最小非重叠样本'
        required: false
        default: '100'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: v6-accuracy-weekly
  cancel-in-progress: false

jobs:
  accuracy-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出 main 研究代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 恢复最近有效生产数据库
        uses: actions/cache/restore@v5
        with:
          path: data/
          key: v6-accuracy-source-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-analysis-data-${{ runner.os }}-

      - name: 校验生产研究数据源
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sqlite3

          path = 'data/stock_analysis.db'
          if not os.path.isfile(path):
              raise SystemExit('stock_analysis.db missing; weekly accuracy replay cannot run')
          if os.path.getsize(path) < 4096:
              raise SystemExit('stock_analysis.db unexpectedly small')

          conn = sqlite3.connect(f'file:{path}?mode=ro', uri=True, timeout=10)
          try:
              quick = str(conn.execute('PRAGMA quick_check').fetchone()[0]).strip().lower()
              tables = {
                  row[0]
                  for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")
              }
              bars = int(conn.execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0]) if 'stock_daily' in tables else 0
          finally:
              conn.close()

          if quick != 'ok':
              raise SystemExit(f'stock_analysis.db quick_check failed: {quick!r}')
          if 'stock_daily' not in tables:
              raise SystemExit('stock_daily table missing')
          if bars <= 0:
              raise SystemExit('stock_daily is empty')
          print(f'Accuracy production source: PASS stock_daily={bars}')
          PY

      - name: 克隆并补齐隔离研究历史
        env:
          INPUT_CODES: ${{ inputs.codes || '' }}
        shell: bash
        run: |
          python scripts/backfill_v6_accuracy_history.py \
            --source-db data/stock_analysis.db \
            --research-db v6_research/stock_analysis_research.db \
            --codes "$INPUT_CODES" \
            --history-years 3 \
            --minimum-bars 81 \
            --summary v6_reports/accuracy_weekly/v6_accuracy_history_backfill.json

      - name: 校验隔离研究历史
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sqlite3

          summary_path = 'v6_reports/accuracy_weekly/v6_accuracy_history_backfill.json'
          research_db = 'v6_research/stock_analysis_research.db'
          if not os.path.isfile(summary_path):
              raise SystemExit('accuracy history backfill summary missing')
          if not os.path.isfile(research_db) or os.path.getsize(research_db) < 4096:
              raise SystemExit('isolated accuracy research database missing or unexpectedly small')

          with open(summary_path, encoding='utf-8') as f:
              payload = json.load(f)
          if payload.get('source_read_only') is not True:
              raise SystemExit('accuracy backfill did not confirm source_read_only=true')
          if payload.get('source_unchanged') is not True:
              raise SystemExit('production stock database changed during research backfill')
          if payload.get('source_database') == payload.get('research_database'):
              raise SystemExit('research backfill attempted to reuse the production database path')
          if int(payload.get('eligible_target_count') or 0) <= 0:
              raise SystemExit('accuracy backfill produced zero replay-eligible targets')
          benchmark_ready = payload.get('benchmark_ready') or {}
          if benchmark_ready.get('SPY') is not True or benchmark_ready.get('QQQ') is not True:
              raise SystemExit(f'accuracy benchmark history incomplete: {benchmark_ready!r}')

          conn = sqlite3.connect(f'file:{research_db}?mode=ro', uri=True, timeout=10)
          try:
              quick = str(conn.execute('PRAGMA quick_check').fetchone()[0]).strip().lower()
              bars = int(conn.execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0])
          finally:
              conn.close()
          if quick != 'ok':
              raise SystemExit(f'isolated research database quick_check failed: {quick!r}')
          if bars <= 0:
              raise SystemExit('isolated research stock_daily is empty')
          print(
              'Accuracy history backfill: PASS '
              f"status={payload.get('status')} bars={bars} "
              f"eligible_targets={payload.get('eligible_target_count')} "
              f"errors={len(payload.get('errors') or [])}"
          )
          PY

      - name: 运行严格 no-lookahead Champion/Challenger 回放
        env:
          INPUT_CODES: ${{ inputs.codes || '' }}
          MIN_SAMPLES: ${{ inputs.min_samples || vars.V6_DAILY_MIN_SAMPLES || '50' }}
          PROMOTION_MIN_SAMPLES: ${{ inputs.promotion_min_samples || vars.V6_ACCURACY_LAB_PROMOTION_MIN_SAMPLES || '100' }}
        shell: bash
        run: |
          python scripts/run_v6_accuracy_weekly.py \
            --stock-db v6_research/stock_analysis_research.db \
            --codes "$INPUT_CODES" \
            --min-samples "$MIN_SAMPLES" \
            --promotion-min-samples "$PROMOTION_MIN_SAMPLES" \
            --output-dir v6_reports/accuracy_weekly

      - name: 校验准确率周报
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          json_path = 'v6_reports/accuracy_weekly/v6_accuracy_weekly.json'
          md_path = 'v6_reports/accuracy_weekly/v6_accuracy_weekly.md'
          for path in (json_path, md_path):
              if not os.path.isfile(path) or os.path.getsize(path) <= 0:
                  raise SystemExit(f'missing/empty weekly accuracy artifact: {path}')

          with open(json_path, encoding='utf-8') as f:
              payload = json.load(f)
          if payload.get('auto_promotion') is not False:
              raise SystemExit('unsafe weekly replay: auto_promotion must be false')
          if payload.get('auto_weight_tuning') is not False:
              raise SystemExit('unsafe weekly replay: auto_weight_tuning must be false')
          if payload.get('method') != 'strict no-lookahead rolling price-feature replay':
              raise SystemExit(f"unexpected replay method: {payload.get('method')!r}")
          if payload.get('yearly_walk_forward_method') != 'raw_and_global_non_overlapping_by_calendar_year_v2':
              raise SystemExit(
                  f"unexpected yearly walk-forward method: {payload.get('yearly_walk_forward_method')!r}"
              )
          if payload.get('selectivity_analysis_method') != 'directional_margin_filter_then_global_non_overlap_v1':
              raise SystemExit(
                  f"unexpected selectivity analysis method: {payload.get('selectivity_analysis_method')!r}"
              )
          if [float(value) for value in (payload.get('selectivity_margin_thresholds') or [])] != [0.0, 2.0, 5.0, 10.0]:
              raise SystemExit(
                  f"unexpected selectivity thresholds: {payload.get('selectivity_margin_thresholds')!r}"
              )
          if payload.get('alpha_target_method') != 'spy_relative_directional_filter_then_global_non_overlap_v1':
              raise SystemExit(
                  f"unexpected alpha target method: {payload.get('alpha_target_method')!r}"
              )
          if payload.get('alpha_calibration_method') != 'fixed_directional_margin_buckets_v1':
              raise SystemExit(
                  f"unexpected alpha calibration method: {payload.get('alpha_calibration_method')!r}"
              )
          alpha_buckets = payload.get('alpha_calibration_buckets') or []
          if [str(item.get('label') or '') for item in alpha_buckets] != ['0-2pt', '2-5pt', '5-10pt', '10pt+']:
              raise SystemExit(f"unexpected alpha calibration buckets: {alpha_buckets!r}")
          if payload.get('regime_matrix_method') != 'global_alpha_non_overlap_then_asof_spy_regime_partition_v1':
              raise SystemExit(
                  f"unexpected regime matrix method: {payload.get('regime_matrix_method')!r}"
              )
          alpha_definition = payload.get('alpha_target_definition') or {}
          if alpha_definition.get('benchmark') != 'SPY' or alpha_definition.get('neutral') != 'excluded':
              raise SystemExit(f"unexpected alpha target definition: {alpha_definition!r}")

          results = payload.get('results')
          if not isinstance(results, list) or not results:
              raise SystemExit('weekly replay results must be a non-empty list')
          observations = int(payload.get('observations') or 0)
          if observations <= 0:
              raise SystemExit('weekly replay produced zero observations')

          expected_variants = {
              'champion',
              'trend_guard',
              'momentum_focus',
              'relative_strength_focus',
          }
          variants = {str(item.get('variant') or '') for item in results}
          missing_variants = expected_variants - variants
          if missing_variants:
              raise SystemExit(f'weekly replay missing variants: {sorted(missing_variants)}')

          champion = [item for item in results if item.get('variant') == 'champion']
          horizons = {int(item.get('horizon_days') or 0) for item in champion}
          if horizons != {5, 10, 20}:
              raise SystemExit(f'weekly champion horizons invalid: {sorted(horizons)}')
          for item in champion:
              horizon = item.get('horizon_days')
              raw = item.get('raw') or {}
              independent = item.get('non_overlapping') or {}
              if int(independent.get('samples') or 0) <= 0:
                  raise SystemExit(f"zero independent samples for champion {horizon}D")
              if independent.get('hit_rate_ci95_low_pct') is None or independent.get('hit_rate_ci95_high_pct') is None:
                  raise SystemExit(f"missing Wilson CI for champion {horizon}D")
              if independent.get('avg_excess_vs_spy_pct') is None:
                  raise SystemExit(f"missing SPY excess for champion {horizon}D")

              yearly = item.get('yearly_walk_forward')
              if not isinstance(yearly, list) or not yearly:
                  raise SystemExit(f"missing yearly walk-forward for champion {horizon}D")
              yearly_raw_samples = 0
              yearly_independent_samples = 0
              for year in yearly:
                  year_raw = year.get('raw')
                  year_independent = year.get('non_overlapping')
                  if not isinstance(year_raw, dict) or not isinstance(year_independent, dict):
                      raise SystemExit(
                          f"missing raw/non-overlapping yearly views for champion {horizon}D year={year.get('year')}"
                      )
                  raw_n = int(year_raw.get('samples') or 0)
                  independent_n = int(year_independent.get('samples') or 0)
                  if raw_n <= 0:
                      raise SystemExit(
                          f"zero raw yearly samples for champion {horizon}D year={year.get('year')}"
                      )
                  if int(year.get('samples') or 0) != raw_n:
                      raise SystemExit(
                          f"legacy yearly raw fields drifted for champion {horizon}D year={year.get('year')}"
                      )
                  if independent_n > 0:
                      if (
                          year_independent.get('hit_rate_ci95_low_pct') is None
                          or year_independent.get('hit_rate_ci95_high_pct') is None
                      ):
                          raise SystemExit(
                              f"missing yearly independent Wilson CI for champion {horizon}D year={year.get('year')}"
                          )
                      if year_independent.get('avg_excess_vs_spy_pct') is None:
                          raise SystemExit(
                              f"missing yearly independent SPY excess for champion {horizon}D year={year.get('year')}"
                          )
                  yearly_raw_samples += raw_n
                  yearly_independent_samples += independent_n

              if yearly_raw_samples != int(raw.get('samples') or 0):
                  raise SystemExit(
                      f"yearly raw sample partition mismatch for champion {horizon}D: "
                      f"yearly={yearly_raw_samples} total={raw.get('samples')}"
                  )
              if yearly_independent_samples != int(independent.get('samples') or 0):
                  raise SystemExit(
                      f"yearly independent sample partition mismatch for champion {horizon}D: "
                      f"yearly={yearly_independent_samples} total={independent.get('samples')}"
                  )

              selectivity = item.get('selectivity_analysis')
              if not isinstance(selectivity, list) or not selectivity:
                  raise SystemExit(f"missing selectivity analysis for champion {horizon}D")
              margins = [float(slice_item.get('min_margin_points')) for slice_item in selectivity]
              if margins != [0.0, 2.0, 5.0, 10.0]:
                  raise SystemExit(
                      f"invalid selectivity margins for champion {horizon}D: {margins!r}"
                  )
              previous_raw_n = None
              previous_participation = None
              for slice_item in selectivity:
                  margin = slice_item.get('min_margin_points')
                  slice_raw = slice_item.get('raw') or {}
                  slice_independent = slice_item.get('non_overlapping') or {}
                  raw_n = int(slice_raw.get('samples') or 0)
                  independent_n = int(slice_independent.get('samples') or 0)
                  participation = slice_item.get('participation_rate_pct')
                  capture = slice_item.get('directional_capture_rate_pct')
                  if raw_n > int(raw.get('samples') or 0):
                      raise SystemExit(
                          f"selectivity raw samples exceed total for champion {horizon}D margin={margin}"
                      )
                  if independent_n > raw_n:
                      raise SystemExit(
                          f"selectivity independent samples exceed raw for champion {horizon}D margin={margin}"
                      )
                  if participation is None or not 0.0 <= float(participation) <= 100.0:
                      raise SystemExit(
                          f"invalid selectivity participation for champion {horizon}D margin={margin}: {participation!r}"
                      )
                  if capture is None or not 0.0 <= float(capture) <= 100.0:
                      raise SystemExit(
                          f"invalid selectivity directional capture for champion {horizon}D margin={margin}: {capture!r}"
                      )
                  if previous_raw_n is not None and raw_n > previous_raw_n:
                      raise SystemExit(
                          f"selectivity samples increased with stricter margin for champion {horizon}D"
                      )
                  if previous_participation is not None and float(participation) > previous_participation + 1e-9:
                      raise SystemExit(
                          f"selectivity participation increased with stricter margin for champion {horizon}D"
                      )
                  if independent_n > 0:
                      if (
                          slice_independent.get('hit_rate_ci95_low_pct') is None
                          or slice_independent.get('hit_rate_ci95_high_pct') is None
                      ):
                          raise SystemExit(
                              f"missing selectivity Wilson CI for champion {horizon}D margin={margin}"
                          )
                      if slice_independent.get('avg_excess_vs_spy_pct') is None:
                          raise SystemExit(
                              f"missing selectivity SPY excess for champion {horizon}D margin={margin}"
                          )
                  previous_raw_n = raw_n
                  previous_participation = float(participation)

              alpha_target = item.get('alpha_target')
              if not isinstance(alpha_target, dict):
                  raise SystemExit(f"missing alpha target for champion {horizon}D")
              alpha_raw = alpha_target.get('raw') or {}
              alpha_independent = alpha_target.get('non_overlapping') or {}
              alpha_raw_n = int(alpha_raw.get('samples') or 0)
              alpha_independent_n = int(alpha_independent.get('samples') or 0)
              if alpha_raw_n > int(raw.get('samples') or 0):
                  raise SystemExit(f"alpha target samples exceed total for champion {horizon}D")
              if alpha_independent_n > alpha_raw_n:
                  raise SystemExit(f"alpha independent samples exceed raw for champion {horizon}D")
              if alpha_independent_n > 0:
                  if (
                      alpha_independent.get('alpha_hit_ci95_low_pct') is None
                      or alpha_independent.get('alpha_hit_ci95_high_pct') is None
                  ):
                      raise SystemExit(f"missing alpha Wilson CI for champion {horizon}D")
                  if alpha_independent.get('avg_alpha_trade_return_pct') is None:
                      raise SystemExit(f"missing alpha spread return for champion {horizon}D")

              calibration = item.get('alpha_calibration')
              if not isinstance(calibration, list):
                  raise SystemExit(f"missing alpha calibration for champion {horizon}D")
              labels = [str(bucket.get('label') or '') for bucket in calibration]
              if labels != ['0-2pt', '2-5pt', '5-10pt', '10pt+']:
                  raise SystemExit(f"invalid alpha calibration labels for champion {horizon}D: {labels!r}")
              calibration_raw_samples = 0
              for bucket in calibration:
                  bucket_raw = bucket.get('raw') or {}
                  bucket_independent = bucket.get('non_overlapping') or {}
                  bucket_raw_n = int(bucket_raw.get('samples') or 0)
                  bucket_independent_n = int(bucket_independent.get('samples') or 0)
                  share = bucket.get('directional_share_pct')
                  if share is None or not 0.0 <= float(share) <= 100.0:
                      raise SystemExit(
                          f"invalid alpha calibration share for champion {horizon}D bucket={bucket.get('label')}"
                      )
                  if bucket_independent_n > bucket_raw_n:
                      raise SystemExit(
                          f"alpha calibration independent samples exceed raw for champion {horizon}D bucket={bucket.get('label')}"
                      )
                  if bucket_independent_n > 0:
                      if (
                          bucket_independent.get('alpha_hit_ci95_low_pct') is None
                          or bucket_independent.get('alpha_hit_ci95_high_pct') is None
                      ):
                          raise SystemExit(
                              f"missing calibration Wilson CI for champion {horizon}D bucket={bucket.get('label')}"
                          )
                      if bucket_independent.get('avg_alpha_trade_return_pct') is None:
                          raise SystemExit(
                              f"missing calibration alpha return for champion {horizon}D bucket={bucket.get('label')}"
                          )
                  calibration_raw_samples += bucket_raw_n
              if calibration_raw_samples > alpha_raw_n:
                  raise SystemExit(
                      f"alpha calibration samples exceed alpha target for champion {horizon}D: "
                      f"calibration={calibration_raw_samples} alpha={alpha_raw_n}"
                  )

              regime_matrix = item.get('regime_matrix')
              if not isinstance(regime_matrix, list):
                  raise SystemExit(f"missing regime matrix for champion {horizon}D")
              allowed_trends = {'up', 'down', 'mixed', 'unknown'}
              allowed_vols = {'expanding', 'contracting', 'unknown'}
              regime_raw_samples = 0
              regime_independent_samples = 0
              for regime in regime_matrix:
                  trend = str(regime.get('spy_trend_regime') or '')
                  vol = str(regime.get('spy_vol_regime') or '')
                  if trend not in allowed_trends or vol not in allowed_vols:
                      raise SystemExit(
                          f"invalid SPY regime for champion {horizon}D: trend={trend!r} vol={vol!r}"
                      )
                  regime_raw = regime.get('raw') or {}
                  regime_independent = regime.get('non_overlapping') or {}
                  regime_raw_n = int(regime_raw.get('samples') or 0)
                  regime_independent_n = int(regime_independent.get('samples') or 0)
                  if regime_independent_n > regime_raw_n:
                      raise SystemExit(
                          f"regime independent samples exceed raw for champion {horizon}D trend={trend} vol={vol}"
                      )
                  if regime_independent_n > 0:
                      if (
                          regime_independent.get('alpha_hit_ci95_low_pct') is None
                          or regime_independent.get('alpha_hit_ci95_high_pct') is None
                      ):
                          raise SystemExit(
                              f"missing regime Wilson CI for champion {horizon}D trend={trend} vol={vol}"
                          )
                      if regime_independent.get('avg_alpha_trade_return_pct') is None:
                          raise SystemExit(
                              f"missing regime alpha return for champion {horizon}D trend={trend} vol={vol}"
                          )
                  regime_raw_samples += regime_raw_n
                  regime_independent_samples += regime_independent_n
              if regime_raw_samples != alpha_raw_n:
                  raise SystemExit(
                      f"regime raw partition mismatch for champion {horizon}D: "
                      f"regime={regime_raw_samples} alpha={alpha_raw_n}"
                  )
              if regime_independent_samples != alpha_independent_n:
                  raise SystemExit(
                      f"regime independent partition mismatch for champion {horizon}D: "
                      f"regime={regime_independent_samples} alpha={alpha_independent_n}"
                  )

          print(
              'Weekly accuracy validation: PASS '
              f"observations={observations} "
              f"candidates={len(payload.get('promotion_candidates') or [])}"
          )
          PY

      - name: 上传准确率研究 Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v6-accuracy-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: v6_reports/accuracy_weekly/
          if-no-files-found: warn
          retention-days: 90
