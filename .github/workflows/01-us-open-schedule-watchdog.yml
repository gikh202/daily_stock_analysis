name: 美股开盘确认调度兜底

on:
  # 与主 workflow 独立的 UTC 候选点。主调度丢失/失败时，watchdog 通过
  # “是否生成开盘确认 Artifact”判断真实覆盖，而不再依赖 V6 重跑。
  schedule:
    - cron: '47,57 13 * * 1-5'
    - cron: '12,27,42,47,57 14 * * 1-5'
    - cron: '12,27,42,57 15,16 * * 1-5'
    - cron: '12,27 17 * * 1-5'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/01-us-open-confirmation.yml'
      - '.github/workflows/01-us-open-schedule-watchdog.yml'
      - 'scripts/validate_us_open_reliability.py'

permissions:
  contents: read

concurrency:
  group: us-open-confirmation-watchdog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-watchdog-design:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate EDT/EST mapping and fallback coverage
        run: python scripts/validate_us_open_reliability.py

  ensure-us-open-confirmation:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read

    steps:
      - name: 检查开盘确认真实覆盖并按需补触发
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const manual = context.eventName === 'workflow_dispatch';

            const now = new Date();
            const nyParts = new Intl.DateTimeFormat('en-US', {
              timeZone: 'America/New_York',
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
              weekday: 'short',
            }).formatToParts(now);
            const part = (type) => nyParts.find((item) => item.type === type)?.value;
            const weekday = part('weekday');
            const hour = Number(part('hour'));
            const minute = Number(part('minute'));
            const hm = hour * 60 + minute;
            const weekdayOk = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].includes(weekday);
            const inWindow = weekdayOk && hm >= 9 * 60 + 45 && hm <= 12 * 60 + 30;

            core.info(
              `New York local: ${weekday} ${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`
            );
            if (!manual && !inWindow) {
              core.info('Outside 09:45-12:30 ET compensation window; skip.');
              return;
            }

            // “workflow success” 本身不能证明发过邮件：主 workflow 在无效 DST
            // 候选/每日已发送时也会成功跳过。因此以真实生成的
            // us-open-confirmation-* Artifact 作为成功覆盖凭证。
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: '01-us-open-confirmation.yml',
              branch: 'main',
              per_page: 50,
            });
            const cutoff = Date.now() - 4 * 60 * 60 * 1000;
            const recentRuns = (response.data.workflow_runs || [])
              .filter((run) => new Date(run.created_at).getTime() >= cutoff)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const inFlight = recentRuns.find(
              (run) => run.status !== 'completed'
            );
            if (inFlight && !manual) {
              core.info(
                `Primary confirmation still in flight: run ${inFlight.id} status=${inFlight.status}; defer fallback.`
              );
              return;
            }

            let covered = null;
            for (const run of recentRuns) {
              if (run.status !== 'completed' || run.conclusion !== 'success') continue;
              const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = (artifactsResponse.data.artifacts || []).find(
                (item) => !item.expired && String(item.name || '').startsWith('us-open-confirmation-')
              );
              if (artifact) {
                covered = {run, artifact};
                break;
              }
            }

            if (covered && !manual) {
              core.info(
                `Open confirmation coverage exists: run ${covered.run.id}, artifact ${covered.artifact.name}; skip.`
              );
              return;
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: '01-us-open-confirmation.yml',
              ref: 'main',
              inputs: {force_resend: 'false'},
            });
            core.info(
              'No successful open-confirmation Artifact or in-flight primary run found; dispatched idempotent fallback.'
            );