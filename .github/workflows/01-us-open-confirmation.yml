name: 美股开盘确认

on:
  # GitHub Actions cron 固定使用 UTC。美东夏令时/冬令时各保留一个候选时间，
  # 运行时再根据 America/New_York 的实际 UTC offset 只放行其中一个。
  # 目标：美股常规交易开盘 15 分钟后（09:45 ET）重新运行完整分析。
  schedule:
    - cron: '45 13 * * 1-5' # 09:45 ET (EDT, UTC-4)
    - cron: '45 14 * * 1-5' # 09:45 ET (EST, UTC-5)

  # 允许手动验证触发链路。
  workflow_dispatch:

  # PR 阶段执行调度回测与阶段护栏回归测试；合并后不会触发主分析。
  pull_request:
    paths:
      - '.github/workflows/01-us-open-confirmation.yml'
      - 'src/phase_decision_guardrail.py'
      - 'tests/test_phase_decision_guardrail.py'
      - 'src/core/trading_calendar.py'
      - 'tests/test_trading_calendar.py'

permissions:
  contents: read

jobs:
  validate-confirmation-design:
    name: confirmation-schedule-backtest
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 调度回测（覆盖夏令时/冬令时）
        shell: bash
        run: |
          python - <<'PY'
          from datetime import date, datetime, time, timedelta, timezone
          from zoneinfo import ZoneInfo

          ny = ZoneInfo('America/New_York')
          start = date(2024, 1, 1)
          end = date(2030, 12, 31)
          day = start
          checked = 0

          while day <= end:
              if day.weekday() < 5:
                  candidates = [
                      datetime.combine(day, time(13, 45), tzinfo=timezone.utc),
                      datetime.combine(day, time(14, 45), tzinfo=timezone.utc),
                  ]
                  matches = [dt for dt in candidates if dt.astimezone(ny).strftime('%H:%M') == '09:45']
                  if len(matches) != 1:
                      raise AssertionError(
                          f'{day}: expected exactly one UTC candidate for 09:45 ET, got '
                          + ', '.join(dt.astimezone(ny).isoformat() for dt in candidates)
                      )
                  checked += 1
              day += timedelta(days=1)

          summer = datetime(2026, 8, 11, 13, 45, tzinfo=timezone.utc).astimezone(ny)
          winter = datetime(2026, 12, 11, 14, 45, tzinfo=timezone.utc).astimezone(ny)
          assert summer.strftime('%H:%M %z') == '09:45 -0400', summer
          assert winter.strftime('%H:%M %z') == '09:45 -0500', winter

          print(f'OK: backtested {checked} weekdays from {start} through {end}')
          print('summer mapping:', summer.isoformat())
          print('winter mapping:', winter.isoformat())
          PY

      - name: 阶段护栏与交易日回归测试
        run: |
          python -m pytest -q \
            tests/test_phase_decision_guardrail.py \
            tests/test_market_phase_summary.py \
            tests/test_trading_calendar.py

  dispatch-open-confirmation:
    name: dispatch-open-confirmation
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - name: 判断当前候选是否对应 09:45 ET
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          NY_NOW="$(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %z')"
          NY_OFFSET="$(TZ='America/New_York' date '+%z')"
          SHOULD_RUN=false
          REASON='non_matching_candidate'

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            SHOULD_RUN=true
            REASON='manual_dispatch'
          elif [ "$EVENT_SCHEDULE" = '45 13 * * 1-5' ] && [ "$NY_OFFSET" = '-0400' ]; then
            SHOULD_RUN=true
            REASON='edt_open_confirmation'
          elif [ "$EVENT_SCHEDULE" = '45 14 * * 1-5' ] && [ "$NY_OFFSET" = '-0500' ]; then
            SHOULD_RUN=true
            REASON='est_open_confirmation'
          fi

          echo "New York time: $NY_NOW"
          echo "schedule: ${EVENT_SCHEDULE:-manual}"
          echo "should_run=$SHOULD_RUN"
          echo "reason=$REASON"
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

      - name: 触发完整盘中确认分析
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '00-daily-analysis.yml',
              ref: 'main',
              inputs: {
                mode: 'full',
                force_run: 'false',
                restore_cache_key: ''
              }
            });
            core.info(`Dispatched 00-daily-analysis.yml for 09:45 ET confirmation; status=${response.status}`);

      - name: 跳过非当前时区候选
        if: ${{ steps.gate.outputs.should_run != 'true' }}
        run: |
          echo '当前 UTC 候选不对应纽约 09:45，跳过，避免夏令时/冬令时重复运行。'
