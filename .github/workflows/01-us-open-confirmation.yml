name: 美股开盘执行确认

on:
  # GitHub schedule 可能延迟，因此保留补偿候选。真正发送由纽约时间门控 + 每日幂等标记控制。
  # 目标：09:45 ET；若 Actions 延迟/失败，最晚补偿到 11:10 ET。
  # V2 在 10:15 ET 后仍可补发状态邮件，但硬性禁止新的 BUY_NOW 授权。
  schedule:
    # EDT (-04:00)
    - cron: '45 13 * * 1-5'
    - cron: '55 13 * * 1-5'
    - cron: '10 14 * * 1-5'
    - cron: '25 14 * * 1-5'
    - cron: '40 14 * * 1-5'
    - cron: '55 14 * * 1-5'
    - cron: '10 15 * * 1-5'
    # EST (-05:00)
    - cron: '45 14 * * 1-5'
    - cron: '25 15 * * 1-5'
    - cron: '40 15 * * 1-5'
    - cron: '55 15 * * 1-5'
    - cron: '10 16 * * 1-5'

  # 手动运行默认仍服从当日幂等标记；只有明确 force_resend 才允许重复发送，便于排障。
  workflow_dispatch:
    inputs:
      force_resend:
        description: '忽略当日已发送标记并强制重发（仅排障使用）'
        required: false
        type: boolean
        default: false

  pull_request:
    paths:
      - '.github/workflows/01-us-open-confirmation.yml'
      - 'scripts/run_us_open_confirmation.py'
      - 'scripts/run_us_open_confirmation_v2.py'
      - 'tests/test_us_open_confirmation.py'
      - 'tests/test_us_open_confirmation_v2.py'

permissions:
  contents: read
  actions: read

concurrency:
  # 所有补偿候选串行执行。第一轮成功后保存当日 marker，后续候选自动跳过。
  group: us-open-confirmation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-open-confirmation:
    name: open-confirmation-tests
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 规则与报告回归测试
        # 纯规则单测，不依赖仓库 tests/conftest.py 的 Web/AnyIO 测试夹具。
        run: |
          python -m pytest -q --noconftest \
            tests/test_us_open_confirmation.py \
            tests/test_us_open_confirmation_v2.py

      - name: Python 语法校验
        run: |
          python -m py_compile \
            scripts/run_us_open_confirmation.py \
            scripts/run_us_open_confirmation_v2.py

  confirm-us-open:
    name: actionable-open-confirmation
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 判断纽约盘中确认窗口
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          FORCE_RESEND_INPUT: ${{ inputs.force_resend }}
        run: |
          set -euo pipefail

          NY_DATE="$(TZ='America/New_York' date '+%Y-%m-%d')"
          NY_HM="$(TZ='America/New_York' date '+%H%M')"
          NY_WEEKDAY="$(TZ='America/New_York' date '+%u')"
          NY_OFFSET="$(TZ='America/New_York' date '+%z')"
          SESSION_OPEN_EPOCH="$(TZ='America/New_York' date -d "${NY_DATE} 09:30:00" '+%s')"

          SHOULD_RUN=false
          FORCE_RESEND=false
          FAMILY_OK=false
          REASON='outside_confirmation_window'

          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            SHOULD_RUN=true
            if [ "${FORCE_RESEND_INPUT:-false}" = 'true' ]; then
              FORCE_RESEND=true
              REASON='manual_force_resend'
            else
              REASON='manual_idempotent_dispatch'
            fi
          else
            if [ "$NY_OFFSET" = '-0400' ]; then
              case "$EVENT_SCHEDULE" in
                '45 13 * * 1-5'|'55 13 * * 1-5'|'10 14 * * 1-5'|'25 14 * * 1-5'|'40 14 * * 1-5'|'55 14 * * 1-5'|'10 15 * * 1-5')
                  FAMILY_OK=true
                  ;;
              esac
            elif [ "$NY_OFFSET" = '-0500' ]; then
              case "$EVENT_SCHEDULE" in
                '45 14 * * 1-5'|'55 14 * * 1-5'|'10 15 * * 1-5'|'25 15 * * 1-5'|'40 15 * * 1-5'|'55 15 * * 1-5'|'10 16 * * 1-5')
                  FAMILY_OK=true
                  ;;
              esac
            fi

            HM=$((10#$NY_HM))
            if [ "$NY_WEEKDAY" -ge 1 ] && [ "$NY_WEEKDAY" -le 5 ] \
              && [ "$HM" -ge 945 ] && [ "$HM" -le 1115 ] \
              && [ "$FAMILY_OK" = 'true' ]; then
              SHOULD_RUN=true
              REASON='scheduled_confirmation_window'
            elif [ "$FAMILY_OK" != 'true' ]; then
              REASON='inactive_dst_schedule_family'
            fi
          fi

          echo "NY date/time: ${NY_DATE} ${NY_HM} ${NY_OFFSET}"
          echo "event schedule: ${EVENT_SCHEDULE:-manual}"
          echo "should_run=${SHOULD_RUN}; force_resend=${FORCE_RESEND}; reason=${REASON}"

          {
            echo "should_run=$SHOULD_RUN"
            echo "force_resend=$FORCE_RESEND"
            echo "ny_date=$NY_DATE"
            echo "session_open_epoch=$SESSION_OPEN_EPOCH"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      - name: 恢复当日已发送标记
        id: sent-cache
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: .open-confirmation-sent/
          key: us-open-confirmation-${{ steps.gate.outputs.ny_date }}

      - name: 判断本轮是否需要执行
        id: once
        if: ${{ steps.gate.outputs.should_run == 'true' }}
        shell: bash
        env:
          FORCE_RESEND: ${{ steps.gate.outputs.force_resend }}
          CACHE_HIT: ${{ steps.sent-cache.outputs.cache-hit }}
        run: |
          if [ "$FORCE_RESEND" = 'true' ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
            echo '已明确启用 force_resend，本轮强制执行盘中确认。'
          elif [ "$CACHE_HIT" = 'true' ]; then
            echo 'execute=false' >> "$GITHUB_OUTPUT"
            echo '今天已经成功发送过开盘确认，跳过补偿/普通手动候选。'
          else
            echo 'execute=true' >> "$GITHUB_OUTPUT"
            echo '本轮执行盘中确认。'
          fi

      - name: 检出代码
        if: ${{ steps.once.outputs.execute == 'true' }}
        uses: actions/checkout@v5

      - name: 设置 Python
        if: ${{ steps.once.outputs.execute == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装运行依赖
        if: ${{ steps.once.outputs.execute == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 查找本次开盘前最近一份成功收盘计划
        id: prior-v6
        if: ${{ steps.once.outputs.execute == 'true' }}
        uses: actions/github-script@v7
        env:
          SESSION_OPEN_EPOCH: ${{ steps.gate.outputs.session_open_epoch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sessionOpenMs = Number(process.env.SESSION_OPEN_EPOCH) * 1000;
            const oldestAllowedMs = sessionOpenMs - 7 * 24 * 60 * 60 * 1000;

            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: '03-v6-daily.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });

            const candidates = (response.data.workflow_runs || [])
              .filter((run) => run.conclusion === 'success')
              .filter((run) => {
                const created = new Date(run.created_at).getTime();
                return created < sessionOpenMs && created >= oldestAllowedMs;
              })
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (!candidates.length) {
              core.setFailed('No successful V6 close-plan run found before today’s 09:30 ET within the last 7 days.');
              return;
            }

            const workflowRunCandidates = candidates.filter((run) => run.event === 'workflow_run');
            const run = workflowRunCandidates[0] || candidates[0];
            core.info(`Using prior close V6 run ${run.id} event=${run.event} created_at=${run.created_at}`);
            core.setOutput('run_id', String(run.id));
            core.setOutput('created_at', run.created_at);

      - name: 下载上一收盘 V6 计划 Artifact
        if: ${{ steps.once.outputs.execute == 'true' && steps.prior-v6.outputs.run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          pattern: v6-daily-*
          path: prior_v6
          merge-multiple: true
          run-id: ${{ steps.prior-v6.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 定位并校验上一收盘结构化计划
        id: plan
        if: ${{ steps.once.outputs.execute == 'true' }}
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ steps.prior-v6.outputs.run_id }}
        run: |
          set -euo pipefail

          PAYLOAD="$(find prior_v6 -type f -path '*/v6_reports/v6_daily_latest.json' -print | sort | tail -n 1 || true)"
          if [ -z "$PAYLOAD" ]; then
            PAYLOAD="$(find prior_v6 -type f -name 'v6_daily_latest.json' -print | sort | tail -n 1 || true)"
          fi
          if [ -z "$PAYLOAD" ]; then
            echo '::error::上一收盘 V6 Artifact 缺少 v6_daily_latest.json，拒绝使用陈旧/猜测计划。'
            exit 2
          fi

          python - "$PAYLOAD" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          payload = json.load(open(path, encoding='utf-8'))
          final = payload.get('final_decisions') or {}
          packets = [x for x in (final.get('packets') or []) if isinstance(x, dict)]
          if not packets:
              raise SystemExit('final_decisions.packets is empty')
          symbols = [
              str((x.get('identity') or {}).get('symbol') or '').strip().upper()
              for x in packets
          ]
          symbols = [x for x in symbols if x]
          if not symbols:
              raise SystemExit('no symbols in final decision packets')
          print(f'Prior close plan PASS packets={len(packets)} symbols={symbols}')
          PY

          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: 运行开盘15分钟执行确认并发送邮件
        if: ${{ steps.once.outputs.execute == 'true' }}
        env:
          OPEN_CONFIRMATION_SOURCE_RUN_ID: ${{ steps.plan.outputs.source_run_id }}
          OPEN_CONFIRMATION_CHASE_TOLERANCE_PCT: ${{ vars.OPEN_CONFIRMATION_CHASE_TOLERANCE_PCT || '0.5' }}
          OPEN_CONFIRMATION_MOMENTUM_CHASE_PCT: ${{ vars.OPEN_CONFIRMATION_MOMENTUM_CHASE_PCT || '0.75' }}
          OPEN_CONFIRMATION_WEAK_OPEN_PCT: ${{ vars.OPEN_CONFIRMATION_WEAK_OPEN_PCT || '-0.5' }}
          OPEN_CONFIRMATION_MIN_VOLUME_RATIO: ${{ vars.OPEN_CONFIRMATION_MIN_VOLUME_RATIO || '0.70' }}
          OPEN_CONFIRMATION_MIN_OPENING_RANGE_POSITION: ${{ vars.OPEN_CONFIRMATION_MIN_OPENING_RANGE_POSITION || '0.25' }}
          OPEN_CONFIRMATION_MOMENTUM_MIN_RANGE_POSITION: ${{ vars.OPEN_CONFIRMATION_MOMENTUM_MIN_RANGE_POSITION || '0.50' }}
          OPEN_CONFIRMATION_MOMENTUM_MIN_VOLUME_RATIO: ${{ vars.OPEN_CONFIRMATION_MOMENTUM_MIN_VOLUME_RATIO || '0.70' }}
          OPEN_CONFIRMATION_MAX_QUOTE_AGE_MINUTES: ${{ vars.OPEN_CONFIRMATION_MAX_QUOTE_AGE_MINUTES || '8' }}
          OPEN_CONFIRMATION_STARTER_POSITION_PCT: ${{ vars.OPEN_CONFIRMATION_STARTER_POSITION_PCT || '10' }}

          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || 'AI 美股开盘执行确认' }}

          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
          NOTIFICATION_REPORT_CHANNELS: ${{ vars.NOTIFICATION_REPORT_CHANNELS || secrets.NOTIFICATION_REPORT_CHANNELS }}
          NOTIFICATION_DEDUP_TTL_SECONDS: ${{ vars.NOTIFICATION_DEDUP_TTL_SECONDS || secrets.NOTIFICATION_DEDUP_TTL_SECONDS || '0' }}
          NOTIFICATION_COOLDOWN_SECONDS: ${{ vars.NOTIFICATION_COOLDOWN_SECONDS || secrets.NOTIFICATION_COOLDOWN_SECONDS || '0' }}
          NOTIFICATION_TIMEZONE: ${{ vars.NOTIFICATION_TIMEZONE || secrets.NOTIFICATION_TIMEZONE || 'Asia/Shanghai' }}
          LOG_LEVEL: INFO
        shell: bash
        run: |
          python scripts/run_us_open_confirmation_v2.py \
            --v6-payload '${{ steps.plan.outputs.payload }}' \
            --output-dir open_confirmation_reports \
            --source-run-id '${{ steps.plan.outputs.source_run_id }}' \
            --notify

      - name: 写入成功标记
        if: ${{ success() && steps.once.outputs.execute == 'true' && steps.sent-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          mkdir -p .open-confirmation-sent
          printf '%s\n' \
            "session_date=${{ steps.gate.outputs.ny_date }}" \
            "source_v6_run=${{ steps.plan.outputs.source_run_id }}" \
            "confirmation_run=${{ github.run_id }}" \
            > ".open-confirmation-sent/${{ steps.gate.outputs.ny_date }}.txt"

      - name: 保存当日已发送标记
        if: ${{ success() && steps.once.outputs.execute == 'true' && steps.sent-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .open-confirmation-sent/
          key: us-open-confirmation-${{ steps.gate.outputs.ny_date }}

      - name: 上传开盘确认报告
        if: ${{ always() && steps.once.outputs.execute == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: us-open-confirmation-${{ github.run_id }}-${{ github.run_attempt }}
          path: open_confirmation_reports/
          if-no-files-found: warn
          retention-days: 30

      - name: 输出跳过原因
        if: ${{ steps.gate.outputs.should_run != 'true' || steps.once.outputs.execute == 'false' }}
        run: |
          echo "gate_reason=${{ steps.gate.outputs.reason }}"
          echo "already_sent_cache=${{ steps.sent-cache.outputs.cache-hit }}"