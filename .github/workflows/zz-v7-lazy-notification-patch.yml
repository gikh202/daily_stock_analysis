name: V7 lazy notification patch

on:
  push:
    branches:
      - refactor/v7-forecast-decision-architecture
    paths:
      - '.github/workflows/zz-v7-lazy-notification-patch.yml'

permissions:
  contents: write

jobs:
  patch-import-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: refactor/v7-forecast-decision-architecture
          fetch-depth: 0

      - name: Make notification dependency lazy and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run_us_open_timing.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from src.notification import NotificationService\n', '', 1)
          old = 'def _notify(report_path:Path,decisions:Sequence[OpenTimingDecision],session_date:str)->bool:\n    service=NotificationService()'
          new = 'def _notify(report_path:Path,decisions:Sequence[OpenTimingDecision],session_date:str)->bool:\n    from src.notification import NotificationService\n    service=NotificationService()'
          if old not in text:
              raise SystemExit('notification helper signature not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/zz-v7-lazy-notification-patch.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_us_open_timing.py
          git commit -m 'fix: lazy-load V7 timing notification stack'
          git push origin HEAD:refactor/v7-forecast-decision-architecture
