name: V7.3 Policy Calibration

on:
  pull_request:
    paths:
      - '.github/workflows/02c-us-open-policy-calibration.yml'
      - 'config/us_open_timing_policy.json'
      - 'config/us_open_policy_registry.json'
      - 'src/forecasting/timing.py'
      - 'src/forecasting/timing_policy.py'
      - 'scripts/calibrate_us_open_timing.py'
      - 'scripts/promote_us_open_policy.py'
      - 'scripts/check_us_open_policy_health.py'
      - 'tests/test_us_open_policy_promotion.py'
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * 0'

permissions:
  contents: read
  actions: read

concurrency:
  group: v73-policy-calibration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run policy and timing tests
        run: |
          python -m pytest -q --noconftest \
            tests/test_v7_intraday_timing.py \
            tests/test_us_open_policy_promotion.py

      - name: Compile V7.3 modules
        run: |
          python -m py_compile \
            src/forecasting/timing.py \
            src/forecasting/timing_policy.py \
            scripts/calibrate_us_open_timing.py \
            scripts/promote_us_open_policy.py \
            scripts/check_us_open_policy_health.py

  causal-wait-backtest:
    if: ${{ github.event_name != 'schedule' }}
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas python-dotenv

      - name: Find latest successful V6/V7 artifact
        id: prior-v6
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '03-v6-daily.yml',
              branch: 'main',
              status: 'completed',
              per_page: 50,
            });
            const run = (response.data.workflow_runs || [])
              .filter((item) => item.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!run) {
              core.setFailed('No successful close forecast run found on main.');
              return;
            }
            core.info(`Using close forecast run ${run.id} created_at=${run.created_at}`);
            core.setOutput('run_id', String(run.id));

      - name: Download V6/V7 history artifact
        uses: actions/download-artifact@v5
        with:
          pattern: v6-daily-*
          path: prior_v6
          merge-multiple: true
          run-id: ${{ steps.prior-v6.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate forecast database
        id: db
        shell: bash
        run: |
          set -euo pipefail
          DB="$(find prior_v6 -type f -name 'v6_daily.db' -print | head -n 1 || true)"
          if [ -z "$DB" ]; then
            echo '::error::Forecast artifact does not contain v6_daily.db'
            exit 2
          fi
          echo "path=$DB" >> "$GITHUB_OUTPUT"

      - name: Run causal WAIT backtest with active V7.3 policy
        shell: bash
        run: |
          python - '${{ steps.db.outputs.path }}' <<'PY'
          import json
          import sys
          from datetime import date, timedelta
          from pathlib import Path

          import scripts.backtest_wait_better_entry as backtest
          from scripts.evaluate_wait_backtest import enrich_wait_backtest
          from src.forecasting.timing_policy import load_timing_policy

          db_path = sys.argv[1]
          cutoff = date.today() - timedelta(days=14)
          original_loader = backtest.load_candidates

          def recent_candidates(path):
              return [
                  item for item in original_loader(path)
                  if date.fromisoformat(item.effective_trade_date) >= cutoff
              ]

          backtest.load_candidates = recent_candidates
          payload = backtest.run_backtest(db_path)
          payload = enrich_wait_backtest(payload, transaction_cost_hurdle_pct=0.10)
          payload['candidate_cutoff'] = cutoff.isoformat()
          payload['active_timing_policy'] = load_timing_policy().to_dict()
          Path('v73_wait_backtest.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Validate backtest evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('v73_wait_backtest.json').read_text(encoding='utf-8'))
          required = {'active_timing_policy', 'wait_sample_count', 'entry_timing_alpha', 'promotion_check'}
          missing = sorted(required - set(data))
          if missing:
              raise SystemExit(f'V7.3 WAIT backtest missing fields: {missing}')
          policy = data['active_timing_policy']
          if policy.get('version') != 'v7.3-policy-001':
              raise SystemExit(f'unexpected active policy version: {policy.get("version")}')
          print('V7.3 causal WAIT backtest PASS')
          print('wait_sample_count=', data.get('wait_sample_count'))
          print('entry_timing_alpha=', data.get('entry_timing_alpha'))
          print('promotion_check=', data.get('promotion_check'))
          PY

      - name: Upload V7.3 WAIT evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v73-wait-backtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: v73_wait_backtest.json
          if-no-files-found: error
          retention-days: 30

  ledger-calibration:
    needs: policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Restore cumulative Research Ledger
        uses: actions/cache/restore@v5
        with:
          path: open_confirmation_research/
          key: v73-policy-research-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            us-open-research-${{ runner.os }}-

      - name: Calibrate Challenger and check policy health
        shell: bash
        run: |
          mkdir -p open_confirmation_reports
          DB='open_confirmation_research/us_open_research.db'
          if [ -s "$DB" ]; then
            python scripts/calibrate_us_open_timing.py \
              --db "$DB" \
              --report-output open_confirmation_reports/us_open_policy_calibration.json \
              --challenger-output open_confirmation_reports/us_open_timing_policy_challenger.json
            python scripts/check_us_open_policy_health.py \
              --db "$DB" \
              --output open_confirmation_reports/us_open_policy_health.json
          else
            python - <<'PY'
          import json
          from pathlib import Path
          Path('open_confirmation_reports/us_open_policy_calibration.json').write_text(
              json.dumps({
                  'version': 'us-open-policy-calibration-v1',
                  'status': 'no_research_cache',
                  'promotion': {'eligible': False, 'reason': 'no_research_cache'},
              }, indent=2), encoding='utf-8')
          Path('open_confirmation_reports/us_open_policy_health.json').write_text(
              json.dumps({
                  'version': 'us-open-policy-health-v1',
                  'status': 'no_research_cache',
                  'rollback_recommended': False,
              }, indent=2), encoding='utf-8')
          PY
          fi

      - name: Report calibration state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('open_confirmation_reports/us_open_policy_calibration.json').read_text(encoding='utf-8'))
          print('calibration_status=', report.get('status'))
          print('promotion_eligible=', (report.get('promotion') or {}).get('eligible'))
          print('Production promotion remains a reviewed pull request even when eligible=true.')
          PY

      - name: Upload policy research evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v73-policy-calibration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            open_confirmation_reports/us_open_policy_calibration.json
            open_confirmation_reports/us_open_policy_health.json
            open_confirmation_reports/us_open_timing_policy_challenger.json
          if-no-files-found: warn
          retention-days: 90
