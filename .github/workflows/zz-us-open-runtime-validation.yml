name: US Open Runtime Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/zz-us-open-runtime-validation.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate-runtime-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record actual New York runtime
        id: clock
        shell: bash
        run: |
          echo "ny_started=$(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %z')" >> "$GITHUB_OUTPUT"
          echo "Started ET: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %z')"

      - name: Checkout latest main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find latest successful V6 close plan before today's open
        id: prior-v6
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date();
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'
            }).formatToParts(now);
            const value = Object.fromEntries(parts.map(p => [p.type, p.value]));
            const nyDate = `${value.year}-${value.month}-${value.day}`;
            const openMs = new Date(`${nyDate}T13:30:00Z`).getTime(); // validation date is EDT
            const oldestAllowedMs = openMs - 7 * 24 * 60 * 60 * 1000;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: '03-v6-daily.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });
            const candidates = (response.data.workflow_runs || [])
              .filter((run) => run.conclusion === 'success')
              .filter((run) => {
                const created = new Date(run.created_at).getTime();
                return created < openMs && created >= oldestAllowedMs;
              })
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            if (!candidates.length) {
              core.setFailed('No successful V6 close-plan run found before today open.');
              return;
            }
            const preferred = candidates.find((run) => run.event === 'workflow_run') || candidates[0];
            core.setOutput('run_id', String(preferred.id));
            core.info(`Using V6 close plan run ${preferred.id} created_at=${preferred.created_at}`);

      - name: Download prior V6 artifact
        uses: actions/download-artifact@v5
        with:
          pattern: v6-daily-*
          path: prior_v6
          merge-multiple: true
          run-id: ${{ steps.prior-v6.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate structured close plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$(find prior_v6 -type f -name 'v6_daily_latest.json' -print | sort | tail -n 1 || true)"
          if [ -z "$PAYLOAD" ]; then
            echo '::error::Prior V6 artifact lacks v6_daily_latest.json'
            exit 2
          fi
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Run current-time open confirmation and send validation email
        id: confirm
        env:
          OPEN_CONFIRMATION_SOURCE_RUN_ID: ${{ steps.prior-v6.outputs.run_id }}
          OPEN_CONFIRMATION_CHASE_TOLERANCE_PCT: ${{ vars.OPEN_CONFIRMATION_CHASE_TOLERANCE_PCT || '0.5' }}
          OPEN_CONFIRMATION_MOMENTUM_CHASE_PCT: ${{ vars.OPEN_CONFIRMATION_MOMENTUM_CHASE_PCT || '0.75' }}
          OPEN_CONFIRMATION_WEAK_OPEN_PCT: ${{ vars.OPEN_CONFIRMATION_WEAK_OPEN_PCT || '-0.5' }}
          OPEN_CONFIRMATION_MIN_VOLUME_RATIO: ${{ vars.OPEN_CONFIRMATION_MIN_VOLUME_RATIO || '0.70' }}
          OPEN_CONFIRMATION_MIN_OPENING_RANGE_POSITION: ${{ vars.OPEN_CONFIRMATION_MIN_OPENING_RANGE_POSITION || '0.25' }}
          OPEN_CONFIRMATION_MOMENTUM_MIN_RANGE_POSITION: ${{ vars.OPEN_CONFIRMATION_MOMENTUM_MIN_RANGE_POSITION || '0.50' }}
          OPEN_CONFIRMATION_MOMENTUM_MIN_VOLUME_RATIO: ${{ vars.OPEN_CONFIRMATION_MOMENTUM_MIN_VOLUME_RATIO || '0.70' }}
          OPEN_CONFIRMATION_MAX_QUOTE_AGE_MINUTES: ${{ vars.OPEN_CONFIRMATION_MAX_QUOTE_AGE_MINUTES || '8' }}
          OPEN_CONFIRMATION_STARTER_POSITION_PCT: ${{ vars.OPEN_CONFIRMATION_STARTER_POSITION_PCT || '10' }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || 'AI 美股开盘执行确认' }}
          NOTIFICATION_REPORT_CHANNELS: email
          NOTIFICATION_DEDUP_TTL_SECONDS: '0'
          NOTIFICATION_COOLDOWN_SECONDS: '0'
          NOTIFICATION_TIMEZONE: Asia/Shanghai
          LOG_LEVEL: INFO
        shell: bash
        run: |
          echo "Before confirmation ET: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %z')"
          python scripts/run_us_open_confirmation_safe.py \
            --v6-payload '${{ steps.plan.outputs.payload }}' \
            --output-dir open_confirmation_reports \
            --source-run-id '${{ steps.prior-v6.outputs.run_id }}' \
            --notify
          echo "After confirmation ET: $(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S %z')"

      - name: Show generated confirmation metadata
        if: always()
        shell: bash
        run: |
          if [ -f open_confirmation_reports/us_open_confirmation_latest.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('open_confirmation_reports/us_open_confirmation_latest.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps({
              'generated_at': data.get('generated_at'),
              'policy_version': data.get('policy_version'),
              'summary': data.get('summary'),
              'source_run_id': data.get('source_run_id'),
          }, ensure_ascii=False, indent=2))
          PY
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: us-open-runtime-validation-${{ github.run_id }}
          path: open_confirmation_reports/
          if-no-files-found: warn
          retention-days: 7
