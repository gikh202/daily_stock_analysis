name: V7.3 Forecast Engine AB Walk-Forward

on:
  pull_request:
    paths:
      - 'src/forecasting/**'
      - 'src/alpha_engine/**'
      - 'src/v6_daily/replay.py'
      - 'scripts/run_forecast_engine_ab_walk_forward.py'
      - 'scripts/backfill_v6_accuracy_history.py'
      - 'src/v6_daily/research_backfill.py'
      - 'tests/test_v73_forecast_maturity_threshold.py'
      - '.github/workflows/03-forecast-engine-ab-walk-forward.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: forecast-engine-ab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  forecast-engine-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout V7.3 candidate
        uses: actions/checkout@v5
        with:
          path: head

      - name: Checkout frozen V7.1 baseline
        uses: actions/checkout@v5
        with:
          ref: 4f50daeee59e73001461c989e35eae931925bd62
          path: v71

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            head/requirements.txt
            head/constraints-production.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c head/constraints-production.txt -r head/requirements.txt
          python -m pip install --disable-pip-version-check pytest

      - name: Run Forecast maturity threshold tests
        run: |
          cd head
          pytest -q --noconftest tests/test_v73_forecast_maturity_threshold.py

      - name: Restore latest production source database
        uses: actions/cache/restore@v5
        with:
          path: data/
          key: forecast-engine-ab-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-analysis-data-${{ runner.os }}-

      - name: Validate source database
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sqlite3
          path = 'data/stock_analysis.db'
          if not os.path.isfile(path):
              raise SystemExit('stock_analysis.db missing; cannot run Forecast Engine AB walk-forward')
          conn = sqlite3.connect(f'file:{path}?mode=ro', uri=True, timeout=10)
          try:
              quick = str(conn.execute('PRAGMA quick_check').fetchone()[0]).strip().lower()
              tables = {row[0] for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              bars = int(conn.execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0]) if 'stock_daily' in tables else 0
          finally:
              conn.close()
          if quick != 'ok' or bars <= 0:
              raise SystemExit(f'invalid source DB: quick={quick!r} stock_daily={bars}')
          print(f'Forecast Engine AB source: PASS stock_daily={bars}')
          PY

      - name: Build identical warmup plus 3-year evaluation research database
        shell: bash
        run: |
          cd head
          # Fetch four years so the first year is input warmup only. The AB runner
          # scores exactly the latest three years for both engines.
          python scripts/backfill_v6_accuracy_history.py \
            --source-db ../data/stock_analysis.db \
            --research-db ../v6_research/stock_analysis_research.db \
            --codes 'MSFT,GOOGL,QQQM,VOO' \
            --history-years 4 \
            --minimum-bars 81 \
            --summary ../forecast_engine_ab_artifacts/history_backfill.json

      - name: Optimize replay harness without changing model semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('head/scripts/run_forecast_engine_ab_walk_forward.py')
          text = path.read_text(encoding='utf-8')

          old_index = "        CREATE INDEX ix_ab_outcome_horizon_end ON v6_forecast_outcomes(horizon_days,end_trade_date);\n"
          new_index = (
              "        CREATE INDEX ix_ab_outcome_horizon_end ON v6_forecast_outcomes(horizon_days,end_trade_date);\n"
              "        CREATE INDEX ix_ab_horizon_run_horizon ON v6_horizon_forecasts(forecast_run_id,horizon_days);\n"
              "        CREATE INDEX ix_ab_run_effective ON v6_forecast_runs(effective_trade_date);\n"
          )
          if old_index not in text:
              raise SystemExit('AB harness index anchor not found')
          text = text.replace(old_index, new_index, 1)

          old_engine = (
              "    engine = V7ForecastEngine(history_db_path=str(history_path))\n"
              "    pending: list[dict[str, Any]] = []\n"
          )
          new_engine = (
              "    engine = V7ForecastEngine(history_db_path=str(history_path))\n"
              "    # Cache identical strict-as-of history reads within one trading date.\n"
              "    # The replay DB gains matured outcomes only when the date advances;\n"
              "    # clearing after _flush_matured() preserves exact no-lookahead semantics.\n"
              "    original_history_rows = engine.history._rows\n"
              "    history_row_cache: dict[tuple[Any, ...], Any] = {}\n"
              "\n"
              "    def cached_history_rows(*row_args: Any, **row_kwargs: Any) -> Any:\n"
              "        cache_key = (row_args, tuple(sorted(row_kwargs.items())))\n"
              "        if cache_key not in history_row_cache:\n"
              "            history_row_cache[cache_key] = original_history_rows(*row_args, **row_kwargs)\n"
              "        return history_row_cache[cache_key]\n"
              "\n"
              "    engine.history._rows = cached_history_rows\n"
              "    pending: list[dict[str, Any]] = []\n"
          )
          if old_engine not in text:
              raise SystemExit('AB harness engine anchor not found')
          text = text.replace(old_engine, new_engine, 1)

          old_flush = (
              "            _flush_matured(conn, pending, as_of)\n"
              "            current_date = as_of\n"
          )
          new_flush = (
              "            _flush_matured(conn, pending, as_of)\n"
              "            history_row_cache.clear()\n"
              "            current_date = as_of\n"
          )
          if old_flush not in text:
              raise SystemExit('AB harness flush anchor not found')
          text = text.replace(old_flush, new_flush, 1)

          path.write_text(text, encoding='utf-8')
          compile(text, str(path), 'exec')
          print('AB harness optimization: PASS (date-scoped history cache + replay indexes)')
          PY

      - name: Run V7.1 vs V7.3 strict 3-year walk-forward AB
        shell: bash
        run: |
          python head/scripts/run_forecast_engine_ab_walk_forward.py \
            --stock-db v6_research/stock_analysis_research.db \
            --old-root v71 \
            --new-root head \
            --codes 'MSFT,GOOGL,QQQM,VOO' \
            --years 3 \
            --min-lookback 80 \
            --output-dir forecast_engine_ab_artifacts/results

      - name: Publish AB report to job summary
        if: always()
        shell: bash
        run: |
          if [ -f forecast_engine_ab_artifacts/results/forecast_engine_ab.md ]; then
            cat forecast_engine_ab_artifacts/results/forecast_engine_ab.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Forecast Engine AB artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forecast-engine-ab-${{ github.run_id }}
          path: forecast_engine_ab_artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Enable squash auto-merge after successful AB
        if: ${{ success() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash \
            --auto
