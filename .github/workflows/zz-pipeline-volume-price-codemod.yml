name: Temporary pipeline volume-price codemod

on:
  push:
    branches:
      - refactor/pipeline-volume-price-stage

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pipeline-volume-price-stage
          fetch-depth: 0

      - name: Extract volume-price helper delegate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/core/pipeline.py")
          text = path.read_text(encoding="utf-8")

          import_marker = "from src.core.stages.market_data import MarketDataPersistenceStage\n"
          import_line = "from src.core.stages.volume_price import VolumePriceFeaturesStage\n"
          if text.count(import_marker) != 1:
              raise SystemExit(f"expected one market-data stage import, found {text.count(import_marker)}")
          if import_line not in text:
              text = text.replace(import_marker, import_marker + import_line, 1)

          start_marker = "    @staticmethod\n    def _build_volume_price_features"
          end_marker = "\n    def _enhance_context("
          if text.count(start_marker) != 1:
              raise SystemExit(f"expected one volume-price helper, found {text.count(start_marker)}")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    @staticmethod
    def _build_volume_price_features(df: pd.DataFrame) -> Optional[Dict[str, Any]]:
        """Build complete-daily-bar volume/price confirmation features."""
        return VolumePriceFeaturesStage.run(df)
'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          git diff -- src/core/pipeline.py

      - name: Commit codemod result
        shell: bash
        run: |
          if git diff --quiet -- src/core/pipeline.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/pipeline.py
          git commit -m "refactor: delegate volume price feature stage"
          git push origin HEAD:refactor/pipeline-volume-price-stage
