name: V6 AI 美股日报

on:
  workflow_run:
    workflows: ['每日股票分析']
    types: [completed]
    # 只有 main 上的生产 V4 运行才自动触发最终日报，避免功能分支误发邮件/污染研究历史。
    branches: [main]
  workflow_dispatch:
    inputs:
      notify:
        description: '通过已配置通知渠道发送最终综合日报'
        required: false
        default: true
        type: boolean
      min_samples:
        description: '预测指标可衡量前所需的最小成熟样本数'
        required: false
        default: '50'
        type: string
      scan_limit:
        description: '最多扫描多少条生产历史记录'
        required: false
        default: '5000'
        type: string

permissions:
  contents: read
  actions: read

# V6 持有独立 SQLite 研究历史，所有运行必须串行，且不应取消正在落盘的运行。
concurrency:
  group: v6-daily
  cancel-in-progress: false

env:
  PYTHONPATH: ${{ github.workspace }}
  V6_DAILY_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.notify) || vars.V6_DAILY_NOTIFY || 'true' }}
  # Stage 10 生产读写均只允许 normalized facts；legacy tables 仅保留历史只读/显式迁移用途。
  V6_DAILY_READ_SOURCE: normalized

jobs:
  v6-daily:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出与上游一致的代码
        uses: actions/checkout@v5
        with:
          # workflow_run 必须与触发它的 V4 使用同一 commit，避免“旧 Artifact + 新代码”的版本漂移。
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装运行依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 准备 V6 目录
        run: mkdir -p data v6_data v6_reports upstream_v4

      - name: 下载本次上游 V4 分析 Artifact
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v5
        with:
          pattern: analysis-reports-*
          path: upstream_v4
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 使用本次上游 Artifact 的生产数据库
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          mapfile -t SOURCE_DBS < <(find upstream_v4 -type f -path '*/data/stock_analysis.db' -print | sort)
          if [ "${#SOURCE_DBS[@]}" -ne 1 ]; then
            echo "::error::预期从本次 V4 Artifact 找到 1 个 data/stock_analysis.db，实际找到 ${#SOURCE_DBS[@]} 个"
            printf '%s\n' "${SOURCE_DBS[@]}"
            exit 2
          fi
          cp "${SOURCE_DBS[0]}" data/stock_analysis.db
          echo "✅ 已绑定本次 V4 Artifact 数据库: ${SOURCE_DBS[0]}"

      - name: 手动运行时恢复最近有效生产数据库
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/cache/restore@v5
        with:
          path: data/
          key: v6-stock-source-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-analysis-data-${{ runner.os }}-

      - name: 恢复 V6 研究历史
        uses: actions/cache/restore@v5
        with:
          path: v6_data/
          key: v6-daily-data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v6-daily-data-${{ runner.os }}-

      - name: 校验生产源数据库
        shell: bash
        run: |
          python - <<'PY'
          import os
          import sqlite3

          path = 'data/stock_analysis.db'
          if not os.path.isfile(path):
              raise SystemExit('stock_analysis.db missing; V6 cannot run')
          if os.path.getsize(path) < 4096:
              raise SystemExit('stock_analysis.db unexpectedly small')

          conn = sqlite3.connect(f'file:{path}?mode=ro', uri=True, timeout=10)
          try:
              quick = str(conn.execute('PRAGMA quick_check').fetchone()[0]).strip().lower()
              tables = {
                  row[0]
                  for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")
              }
              history = int(conn.execute('SELECT COUNT(*) FROM analysis_history').fetchone()[0]) if 'analysis_history' in tables else 0
              bars = int(conn.execute('SELECT COUNT(*) FROM stock_daily').fetchone()[0]) if 'stock_daily' in tables else 0
          finally:
              conn.close()

          if quick != 'ok':
              raise SystemExit(f'stock_analysis.db quick_check failed: {quick!r}')
          missing = {'analysis_history', 'stock_daily'} - tables
          if missing:
              raise SystemExit(f'missing required V6 source tables: {sorted(missing)}')
          if history <= 0:
              raise SystemExit('analysis_history is empty')
          if bars <= 0:
              raise SystemExit('stock_daily is empty')
          print(f'V6 source database: PASS history={history} stock_daily={bars}')
          PY

      - name: 运行 V6 并生成 V4+V6 中文综合日报
        env:
          V6_DAILY_MIN_SAMPLES: ${{ inputs.min_samples || vars.V6_DAILY_MIN_SAMPLES || '50' }}
          V6_DAILY_SCAN_LIMIT: ${{ inputs.scan_limit || vars.V6_DAILY_SCAN_LIMIT || '5000' }}
          V6_FREE_SOURCE_ENRICHMENT: ${{ vars.V6_FREE_SOURCE_ENRICHMENT || 'true' }}
          V6_ACCURACY_LAB_COST_BPS: ${{ vars.V6_ACCURACY_LAB_COST_BPS || '10' }}
          V6_ACCURACY_LAB_MAX_HOLDING_BARS: ${{ vars.V6_ACCURACY_LAB_MAX_HOLDING_BARS || '20' }}
          V6_ACCURACY_LAB_PROMOTION_MIN_SAMPLES: ${{ vars.V6_ACCURACY_LAB_PROMOTION_MIN_SAMPLES || '100' }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || secrets.SEC_USER_AGENT }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          REPORT_LANGUAGE: zh
          LOG_LEVEL: INFO
        shell: bash
        run: |
          EXTRA_ARGS=()

          V4_REPORT_PATH="$(find upstream_v4 -type f -path '*/reports/report_*.md' -print 2>/dev/null | sort | tail -n 1 || true)"
          if [ -z "$V4_REPORT_PATH" ]; then
            V4_REPORT_PATH="$(find upstream_v4 -type f -name 'report_*.md' -print 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [ -n "$V4_REPORT_PATH" ]; then
            echo "✅ 找到本次上游 V4 报告，将合并到最终中文日报: $V4_REPORT_PATH"
            EXTRA_ARGS+=(--v4-report "$V4_REPORT_PATH")
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "::error::本次 V4 Artifact 缺少 reports/report_*.md，拒绝使用陈旧报告降级"
            exit 2
          else
            echo "⚠️ 手动 V6 未提供上游 V4 报告，将仅使用生产数据库中的 V4 结构化记录"
          fi

          # Stage 10 生产入口：normalized-only write + normalized-only consumers。
          # legacy fact tables 在运行前后做内容指纹校验，任何写入都会阻断缓存和通知。
          V6_DAILY_NOTIFY=false python scripts/run_v6_daily_stage10.py \
            --stock-db data/stock_analysis.db \
            --v6-db v6_data/v6_daily.db \
            --report-dir v6_reports \
            --limit "${V6_DAILY_SCAN_LIMIT}" \
            --min-samples "${V6_DAILY_MIN_SAMPLES}" \
            "${EXTRA_ARGS[@]}"

      - name: 校验 V6 数据库、Accuracy Lab、Stage 10 Gate 与综合日报
        id: validate_v6
        shell: bash
        env:
          EXPECT_V4_MERGED: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sqlite3
          from pathlib import Path

          from src.v6_daily.production_gate import assert_stage10_production_gate

          db = 'v6_data/v6_daily.db'
          report = 'v6_reports/v6_daily_latest.md'
          run = 'v6_reports/v6_run.json'
          payload_path = 'v6_reports/v6_daily_latest.json'
          lab_json = 'v6_reports/v6_accuracy_lab.json'
          lab_md = 'v6_reports/v6_accuracy_lab.md'
          output = os.environ['GITHUB_OUTPUT']

          for path in (db, report, run, payload_path, lab_json, lab_md):
              if not os.path.isfile(path):
                  raise SystemExit(f'missing V6 output: {path}')
              if os.path.getsize(path) <= 0:
                  raise SystemExit(f'empty V6 output: {path}')

          conn = sqlite3.connect(f'file:{db}?mode=ro', uri=True, timeout=10)
          try:
              quick = str(conn.execute('PRAGMA quick_check').fetchone()[0]).strip().lower()
              tables = {
                  row[0]
                  for row in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")
              }
              signals = int(conn.execute('SELECT COUNT(*) FROM v6_forecast_runs').fetchone()[0])
              outcomes = int(conn.execute('SELECT COUNT(*) FROM v6_forecast_outcomes').fetchone()[0])
          finally:
              conn.close()
          if quick != 'ok':
              raise SystemExit(f'v6_daily.db quick_check failed: {quick!r}')
          if signals <= 0:
              raise SystemExit('V6 generated zero usable normalized forecasts')
          missing_lab_tables = {
              'v6_accuracy_shadow_forecasts',
              'v6_accuracy_shadow_outcomes',
              'v6_accuracy_trade_outcomes',
          } - tables
          if missing_lab_tables:
              raise SystemExit(f'missing normalized V6 Accuracy Lab tables: {sorted(missing_lab_tables)}')

          with open(run, encoding='utf-8') as f:
              run_payload = json.load(f)
          with open(payload_path, encoding='utf-8') as f:
              payload = json.load(f)
          with open(lab_json, encoding='utf-8') as f:
              lab_payload = json.load(f)
          with open(report, encoding='utf-8') as f:
              report_text = f.read()

          if run_payload.get('stage10_entrypoint') != 'v6-stage10-legacy-projection-shutdown-v1':
              raise SystemExit(f"unexpected Stage 10 entrypoint metadata: {run_payload.get('stage10_entrypoint')!r}")

          production_gate = assert_stage10_production_gate(run_payload)
          if production_gate.get('production_ready') is not True:
              raise SystemExit(f'V6 production gate unexpectedly not ready: {production_gate}')
          if production_gate.get('selected_source') != 'normalized_v6_tables':
              raise SystemExit(f"unexpected production read source: {production_gate.get('selected_source')!r}")
          if production_gate.get('read_parity') != 'exact':
              raise SystemExit(f"unexpected production read parity: {production_gate.get('read_parity')!r}")
          if production_gate.get('write_mode') != 'normalized_only_no_legacy_projection':
              raise SystemExit(f"unexpected production write mode: {production_gate.get('write_mode')!r}")
          if production_gate.get('identity_source') != 'normalized_sequence_only':
              raise SystemExit(f"unexpected normalized identity source: {production_gate.get('identity_source')!r}")
          if production_gate.get('legacy_projection_enabled') is not False:
              raise SystemExit('legacy compatibility projection is still enabled')
          if int(production_gate.get('legacy_projection_writes') or -1) != 0:
              raise SystemExit(f"legacy projection wrote rows: {production_gate.get('legacy_projection_writes')!r}")
          if production_gate.get('legacy_fact_tables_unchanged') is not True:
              raise SystemExit('legacy fact-table fingerprint changed during production run')
          if int(production_gate.get('legacy_consumer_count') or -1) != 0:
              raise SystemExit(f"active legacy consumers remain: {production_gate.get('legacy_consumer_count')!r}")
          if production_gate.get('projection_retirement_ready') is not True:
              raise SystemExit('legacy projection is not retirement-ready')

          run_payload['production_gate'] = production_gate
          payload['production_gate'] = production_gate
          Path(run).write_text(
              json.dumps(run_payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          Path(payload_path).write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )

          unified = run_payload.get('unified_report') or {}
          if unified.get('language') != 'zh':
              raise SystemExit(f"unexpected V6 report language metadata: {unified.get('language')!r}")
          if unified.get('fusion_mode') != 'structured_v4_v6':
              raise SystemExit(f"unexpected V6 fusion mode: {unified.get('fusion_mode')!r}")
          if unified.get('accuracy_layer') != 'v6.2' or run_payload.get('accuracy_layer') != 'v6.2':
              raise SystemExit('V6.2 accuracy layer metadata missing')
          if os.getenv('EXPECT_V4_MERGED') == 'true' and unified.get('v4_merged') is not True:
              raise SystemExit('workflow_run expected same-run V4 structured data, but v4_merged is not true')

          chinese_chars = len(re.findall(r'[\u4e00-\u9fff]', report_text))
          heading_count = len(re.findall(r'(?m)^##\s+', report_text))
          if chinese_chars < 40:
              raise SystemExit(f'V6 final report has insufficient Chinese content: {chinese_chars} chars')
          if heading_count < 3:
              raise SystemExit(f'V6 final report structure is incomplete: {heading_count} section headings')

          board = [item for item in (payload.get('board') or []) if isinstance(item, dict)]
          if not board:
              raise SystemExit('V6 JSON payload has an empty board')
          missing_codes = [
              str(item.get('code') or '').strip().upper()
              for item in board
              if str(item.get('code') or '').strip().upper() not in report_text
          ]
          if missing_codes:
              raise SystemExit(f'V6 report is missing board symbols: {missing_codes}')
          if signals < len(board):
              raise SystemExit(f'normalized forecast count {signals} is smaller than board size {len(board)}')
          if str(payload.get('version') or '') != str(run_payload.get('version') or ''):
              raise SystemExit('V6 JSON payload version does not match v6_run.json version')

          embedded_lab = payload.get('accuracy_lab') or {}
          run_lab = run_payload.get('accuracy_lab') or {}
          if embedded_lab.get('version') != lab_payload.get('version'):
              raise SystemExit('embedded Accuracy Lab version does not match artifact')
          if run_lab.get('version') != lab_payload.get('version'):
              raise SystemExit('v6_run Accuracy Lab version does not match artifact')
          lab_source = lab_payload.get('source') or {}
          if lab_source.get('mode') != 'normalized_only':
              raise SystemExit(f"Accuracy Lab source is not normalized-only: {lab_source}")
          if int(lab_source.get('legacy_signal_reads') or 0) != 0:
              raise SystemExit('Accuracy Lab still reads legacy signal facts')
          if int(lab_source.get('legacy_outcome_reads') or 0) != 0:
              raise SystemExit('Accuracy Lab still reads legacy outcome facts')
          policy = lab_payload.get('policy') or {}
          if policy.get('auto_promotion') is not False or policy.get('auto_weight_tuning') is not False:
              raise SystemExit('unsafe Accuracy Lab policy: automatic promotion/tuning must remain disabled')
          if policy.get('non_overlapping_validation') is not True:
              raise SystemExit('Accuracy Lab non-overlapping validation is not enabled')
          if not isinstance(lab_payload.get('champion'), list) or not isinstance(lab_payload.get('challengers'), list):
              raise SystemExit('Accuracy Lab metrics payload is incomplete')

          retirement = run_payload.get('legacy_retirement') or {}
          if retirement.get('status') != 'retirement_ready':
              raise SystemExit(f"legacy retirement audit not ready: {retirement}")
          if retirement.get('legacy_projection_enabled') is not False:
              raise SystemExit('legacy retirement metadata still marks projection enabled')
          if int(retirement.get('legacy_consumer_count') or -1) != 0:
              raise SystemExit(f"legacy retirement audit reports active consumers: {retirement}")
          if retirement.get('legacy_projection_required_by_active_consumers') is not False:
              raise SystemExit('legacy projection is still required by an active consumer')

          write_guard = run_payload.get('legacy_write_guard') or {}
          if write_guard.get('status') != 'unchanged':
              raise SystemExit(f"legacy write guard did not pass: {write_guard}")
          if write_guard.get('legacy_writes_detected') is not False:
              raise SystemExit('legacy write guard detected a mutation')
          if write_guard.get('fact_tables_unchanged') is not True:
              raise SystemExit('legacy write guard did not prove fact tables unchanged')
          if int(write_guard.get('legacy_projection_writes') or -1) != 0:
              raise SystemExit('legacy write guard reports projection writes')

          notification = run_payload.get('notification') or {}
          if notification.get('status') != 'disabled' or notification.get('attempted') is not False:
              raise SystemExit('V6 generation attempted notification before validation')

          run_stats = run_payload.get('run') or {}
          if str(run_stats.get('quick_check') or '').strip().lower() != 'ok':
              raise SystemExit('V6 run metadata does not confirm quick_check=ok')
          if int(run_stats.get('canonical_signals_seen') or 0) <= 0:
              raise SystemExit('V6 run metadata has zero canonical signals')

          with open(output, 'a', encoding='utf-8') as f:
              f.write('valid=true\n')
              f.write('production_ready=true\n')
          print(
              'V6 Stage 10 production validation: PASS '
              f'normalized_signals={signals} normalized_outcomes={outcomes} board={len(board)} '
              f"source={production_gate.get('selected_source')} "
              f"read_parity={production_gate.get('read_parity')} "
              f"write_mode={production_gate.get('write_mode')} "
              f"legacy_writes={production_gate.get('legacy_projection_writes')} "
              f"legacy_unchanged={production_gate.get('legacy_fact_tables_unchanged')} "
              f"scoreboard={run_payload.get('scoreboard_status')} "
              f"accuracy_lab={lab_payload.get('status')} "
              f"v4_merged={unified.get('v4_merged')} chinese_chars={chinese_chars}"
          )
          PY

      - name: 保存 V6 生产研究历史
        if: ${{ !cancelled() && steps.validate_v6.outputs.valid == 'true' && steps.validate_v6.outputs.production_ready == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: v6_data/
          key: v6-daily-data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Production Gate 通过后发送最终综合日报
        if: ${{ success() && steps.validate_v6.outputs.valid == 'true' && steps.validate_v6.outputs.production_ready == 'true' }}
        env:
          V6_UNIFIED_EMAIL_FINAL: 'true'
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER || secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ vars.EMAIL_RECEIVERS || secrets.EMAIL_RECEIVERS }}
          EMAIL_SENDER_NAME: ${{ vars.EMAIL_SENDER_NAME || secrets.EMAIL_SENDER_NAME || 'AI 美股综合日报' }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          GOTIFY_URL: ${{ secrets.GOTIFY_URL }}
          GOTIFY_TOKEN: ${{ secrets.GOTIFY_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}
          NOTIFICATION_REPORT_CHANNELS: ${{ vars.NOTIFICATION_REPORT_CHANNELS || secrets.NOTIFICATION_REPORT_CHANNELS }}
          NOTIFICATION_DEDUP_TTL_SECONDS: ${{ vars.NOTIFICATION_DEDUP_TTL_SECONDS || secrets.NOTIFICATION_DEDUP_TTL_SECONDS || '0' }}
          NOTIFICATION_COOLDOWN_SECONDS: ${{ vars.NOTIFICATION_COOLDOWN_SECONDS || secrets.NOTIFICATION_COOLDOWN_SECONDS || '0' }}
          NOTIFICATION_TIMEZONE: ${{ vars.NOTIFICATION_TIMEZONE || secrets.NOTIFICATION_TIMEZONE || 'Asia/Shanghai' }}
          LOG_LEVEL: INFO
        shell: bash
        run: |
          python - <<'PY'
          import json
          import logging
          import os
          from datetime import datetime
          from pathlib import Path

          from src.v6_daily.production_gate import assert_stage10_production_gate

          logging.basicConfig(
              level=os.getenv('LOG_LEVEL', 'INFO').upper(),
              format='%(asctime)s | %(levelname)s | %(name)s | %(message)s',
          )

          def truthy(value):
              return str(value or '').strip().lower() in {'1', 'true', 'yes', 'on'}

          run_path = Path('v6_reports/v6_run.json')
          payload_path = Path('v6_reports/v6_daily_latest.json')
          report_path = Path('v6_reports/v6_daily_latest.md')

          with run_path.open(encoding='utf-8') as f:
              run_payload = json.load(f)

          # Defense in depth：通知阶段独立重跑 Stage 10 strict gate。
          gate = assert_stage10_production_gate(run_payload)
          if gate.get('notification_allowed') is not True:
              raise SystemExit(f'production gate forbids notification: {gate}')
          if gate.get('legacy_projection_enabled') is not False:
              raise SystemExit('notification blocked: legacy projection enabled')
          if int(gate.get('legacy_projection_writes') or -1) != 0:
              raise SystemExit('notification blocked: legacy projection wrote rows')
          if gate.get('legacy_fact_tables_unchanged') is not True:
              raise SystemExit('notification blocked: legacy fact tables changed')
          if int(gate.get('legacy_consumer_count') or -1) != 0:
              raise SystemExit('notification blocked: active legacy consumer remains')

          if not truthy(os.getenv('V6_DAILY_NOTIFY')):
              print('V6 通知已禁用；报告和 production-ready 研究历史仍已正常生成并保存。')
              raise SystemExit(0)

          with payload_path.open(encoding='utf-8') as f:
              payload = json.load(f)
          codes = [
              str(item.get('code') or '').strip().upper()
              for item in (payload.get('board') or [])
              if isinstance(item, dict) and str(item.get('code') or '').strip()
          ]

          notification = {
              'attempted': True,
              'success': False,
              'status': 'failed',
          }
          try:
              from src.notification import NotificationService

              service = NotificationService()
              if not service.is_available():
                  notification['status'] = 'no_channel'
              else:
                  success = service.send(
                      report_path.read_text(encoding='utf-8'),
                      email_stock_codes=codes,
                      email_send_to_all=True,
                      route_type='report',
                      severity='info',
                      dedup_key=f"v6-unified-daily-{datetime.now().strftime('%Y%m%d')}",
                  )
                  notification['success'] = bool(success)
                  notification['status'] = 'sent' if success else 'failed'
          except Exception as exc:
              notification['status'] = 'exception'
              notification['error'] = f'{type(exc).__name__}: {exc}'

          run_payload['notification'] = notification
          run_path.write_text(
              json.dumps(run_payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )

          if not notification['success']:
              raise SystemExit(f"V6 final notification failed: {notification}")
          print('V6 final notification: PASS')
          PY

      - name: 上传 V6 综合日报 Artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v6-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            v6_reports/
            v6_data/v6_daily.db
          if-no-files-found: warn
          retention-days: 30
