name: V6 Daily CI

on:
  pull_request:
    paths:
      - 'src/v6_daily/**'
      - 'scripts/run_v6_daily.py'
      - 'scripts/run_v6_replay.py'
      - 'scripts/run_v6_accuracy_replay.py'
      - 'scripts/run_v6_accuracy_weekly.py'
      - 'scripts/backfill_v6_accuracy_history.py'
      - 'src/alpha_engine/models.py'
      - 'src/alpha_engine/engine.py'
      - 'src/alpha_engine/validation.py'
      - 'tests/test_v6_daily.py'
      - 'tests/test_v6_accuracy_foundation.py'
      - 'tests/test_v6_runner_accuracy.py'
      - 'tests/test_v6_accuracy_lab.py'
      - 'tests/test_v6_lab_replay.py'
      - 'tests/test_v6_research_backfill.py'
      - 'tests/test_v6_balanced_decision_analysis.py'
      - 'tests/test_v6_decision_packet.py'
      - 'tests/test_v6_final_decision_packet.py'
      - 'tests/test_v6_final_decision_shadow_parity.py'
      - 'tests/test_v6_final_decision_renderer.py'
      - 'tests/test_v6_final_decision_single_source.py'
      - 'tests/test_v6_decision_audit.py'
      - 'tests/test_v6_normalized_persistence.py'
      - 'tests/test_v6_normalized_read_cutover.py'
      - 'tests/test_v6_production_gate.py'
      - 'tests/test_v6_canonical_write_store.py'
      - 'tests/test_alpha_engine.py'
      - 'tests/test_alpha_validation.py'
      - '.github/workflows/ci-v6-daily.yml'
      - '.github/workflows/03-v6-daily.yml'
      - '.github/workflows/04-v6-accuracy-weekly.yml'
  push:
    branches:
      - 'agent/v6-accuracy-foundation'
      - 'feature/v6-2-accuracy-lab'
      - 'feature/v6-2-accuracy-history-backfill'
    paths:
      - 'src/v6_daily/**'
      - 'scripts/run_v6_daily.py'
      - 'scripts/run_v6_replay.py'
      - 'scripts/run_v6_accuracy_replay.py'
      - 'scripts/run_v6_accuracy_weekly.py'
      - 'scripts/backfill_v6_accuracy_history.py'
      - 'src/alpha_engine/models.py'
      - 'src/alpha_engine/engine.py'
      - 'src/alpha_engine/validation.py'
      - 'tests/test_v6_daily.py'
      - 'tests/test_v6_accuracy_foundation.py'
      - 'tests/test_v6_runner_accuracy.py'
      - 'tests/test_v6_accuracy_lab.py'
      - 'tests/test_v6_lab_replay.py'
      - 'tests/test_v6_research_backfill.py'
      - 'tests/test_v6_balanced_decision_analysis.py'
      - 'tests/test_v6_decision_packet.py'
      - 'tests/test_v6_final_decision_packet.py'
      - 'tests/test_v6_final_decision_shadow_parity.py'
      - 'tests/test_v6_final_decision_renderer.py'
      - 'tests/test_v6_final_decision_single_source.py'
      - 'tests/test_v6_decision_audit.py'
      - 'tests/test_v6_normalized_persistence.py'
      - 'tests/test_v6_normalized_read_cutover.py'
      - 'tests/test_v6_production_gate.py'
      - 'tests/test_v6_canonical_write_store.py'
      - 'tests/test_alpha_engine.py'
      - 'tests/test_alpha_validation.py'
      - '.github/workflows/ci-v6-daily.yml'
      - '.github/workflows/03-v6-daily.yml'
      - '.github/workflows/04-v6-accuracy-weekly.yml'

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  v6-daily-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install repository test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade pytest

      - name: Compile V6 modules
        run: |
          python -m py_compile \
            src/v6_daily/__init__.py \
            src/v6_daily/models.py \
            src/v6_daily/decision_contracts.py \
            src/v6_daily/fusion_contracts.py \
            src/v6_daily/v4_research_adapter.py \
            src/v6_daily/final_decision_service.py \
            src/v6_daily/final_decision_renderer.py \
            src/v6_daily/decision_audit.py \
            src/v6_daily/versioned_store.py \
            src/v6_daily/normalized_persistence.py \
            src/v6_daily/canonical_write_store.py \
            src/v6_daily/normalized_read_store.py \
            src/v6_daily/read_cutover.py \
            src/v6_daily/production_gate.py \
            src/v6_daily/unified_report.py \
            src/v6_daily/accuracy.py \
            src/v6_daily/accuracy_lab.py \
            src/v6_daily/lab_replay.py \
            src/v6_daily/research_backfill.py \
            src/v6_daily/accuracy_report.py \
            src/v6_daily/engine.py \
            src/v6_daily/store.py \
            src/v6_daily/free_sources.py \
            src/v6_daily/replay.py \
            src/v6_daily/report.py \
            scripts/run_v6_daily.py \
            scripts/run_v6_replay.py \
            scripts/run_v6_accuracy_replay.py \
            scripts/run_v6_accuracy_weekly.py \
            scripts/backfill_v6_accuracy_history.py \
            src/alpha_engine/models.py \
            src/alpha_engine/engine.py \
            src/alpha_engine/validation.py

      - name: Run V6 accuracy and validation tests
        env:
          V6_FREE_SOURCE_ENRICHMENT: 'false'
        run: |
          python -m pytest -q \
            tests/test_v6_daily.py \
            tests/test_v6_accuracy_foundation.py \
            tests/test_v6_runner_accuracy.py \
            tests/test_v6_accuracy_lab.py \
            tests/test_v6_lab_replay.py \
            tests/test_v6_research_backfill.py \
            tests/test_v6_balanced_decision_analysis.py \
            tests/test_v6_decision_packet.py \
            tests/test_v6_final_decision_packet.py \
            tests/test_v6_final_decision_shadow_parity.py \
            tests/test_v6_final_decision_renderer.py \
            tests/test_v6_final_decision_single_source.py \
            tests/test_v6_decision_audit.py \
            tests/test_v6_normalized_persistence.py \
            tests/test_v6_normalized_read_cutover.py \
            tests/test_v6_production_gate.py \
            tests/test_v6_canonical_write_store.py \
            tests/test_alpha_engine.py \
            tests/test_alpha_validation.py