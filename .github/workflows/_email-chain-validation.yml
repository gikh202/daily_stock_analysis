name: One-shot email chain validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_email-chain-validation.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch US open confirmation chain
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '01-us-open-confirmation.yml',
              ref: 'main',
            });
            core.info('Dispatched US open confirmation workflow for end-to-end validation.');
