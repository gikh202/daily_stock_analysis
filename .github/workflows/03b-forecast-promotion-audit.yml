name: Forecast Promotion Audit

on:
  pull_request:
    paths:
      - 'src/forecasting/**'
      - 'src/v6_daily/production_benchmarks.py'
      - 'src/v6_daily/production_outcomes.py'
      - 'src/v6_daily/production_runner.py'
      - 'scripts/audit_forecast_promotion.py'
      - 'tests/test_v8_forecast_promotion_scope.py'
      - 'tests/test_v8_forecast_benchmark_alpha.py'
      - '.github/workflows/03b-forecast-promotion-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '7 15 * * 0'

permissions:
  contents: read
  actions: read

concurrency:
  group: forecast-promotion-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  promotion-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Validate promotion contracts
        run: |
          python -m pytest -q --noconftest \
            tests/test_v8_forecast_promotion_scope.py
          python -m py_compile \
            src/forecasting/history.py \
            scripts/audit_forecast_promotion.py

      - name: Find latest successful production V6 run
        id: prior-v6
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '03-v6-daily.yml',
              branch: 'main',
              status: 'completed',
              per_page: 50,
            });
            const run = (response.data.workflow_runs || [])
              .filter((item) => item.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!run) {
              core.setFailed('No successful V6/V7 production run found on main.');
              return;
            }
            core.info('Using V6 production run ' + run.id + ' created_at=' + run.created_at);
            core.setOutput('run_id', String(run.id));

      - name: Download production forecast history
        uses: actions/download-artifact@v5
        with:
          pattern: v6-daily-*
          path: prior_v6
          merge-multiple: true
          run-id: ${{ steps.prior-v6.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate production forecast database
        id: db
        shell: bash
        run: |
          set -euo pipefail
          DB="$(find prior_v6 -type f -name 'v6_daily.db' -print | head -n 1 || true)"
          if [ -z "$DB" ]; then
            echo '::error::Production artifact does not contain v6_daily.db'
            exit 2
          fi
          echo "path=$DB" >> "$GITHUB_OUTPUT"

      - name: Run symbol x horizon promotion audit
        shell: bash
        run: |
          mkdir -p forecast_promotion_audit
          python scripts/audit_forecast_promotion.py \
            --db '${{ steps.db.outputs.path }}' \
            --json-output forecast_promotion_audit/forecast_promotion_audit.json \
            --markdown-output forecast_promotion_audit/forecast_promotion_audit.md

      - name: Publish promotion matrix
        if: always()
        shell: bash
        run: |
          if [ -f forecast_promotion_audit/forecast_promotion_audit.md ]; then
            cat forecast_promotion_audit/forecast_promotion_audit.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: forecast-promotion-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: forecast_promotion_audit/
          if-no-files-found: warn
          retention-days: 90
