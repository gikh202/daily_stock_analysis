name: V7.2 Apply Execution Flow Patch

on:
  push:
    branches:
      - feature/v7.2-decision-engine-upgrade
    paths:
      - .github/workflows/v72_apply_execution_flow.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/v7.2-decision-engine-upgrade

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Patch research ledger
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/us_open_research_ledger.py")
          s = p.read_text(encoding="utf-8")
          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit(f"ledger pattern not found: {old[:80]!r}")
              s = s.replace(old, new, 1)
          rep('SCHEMA_VERSION = "us-open-research-ledger-v2"', 'SCHEMA_VERSION = "us-open-research-ledger-v3"')
          rep('''            minutes_to_reference_better_price REAL,\n            outcome_json TEXT\n''', '''            minutes_to_reference_better_price REAL,\n            close_plan_json TEXT,\n            execution_transition TEXT,\n            outcome_json TEXT\n''')
          rep('''        "minutes_to_reference_better_price": "REAL",\n    }.items():\n''', '''        "minutes_to_reference_better_price": "REAL",\n        "close_plan_json": "TEXT",\n        "execution_transition": "TEXT",\n    }.items():\n''')
          marker = '\ndef record_signal(\n'
          helper = '''\ndef _close_execution_contract(packet: Mapping[str, Any]) -> dict[str, Any]:\n    assessment = packet.get("assessment") if isinstance(packet.get("assessment"), Mapping) else {}\n    execution = packet.get("execution") if isinstance(packet.get("execution"), Mapping) else {}\n    explicit_status = str(assessment.get("execution_status") or execution.get("execution_status") or "").strip().upper()\n    authorized = bool(assessment.get("execution_authorized") if "execution_authorized" in assessment else execution.get("execution_authorized"))\n    verdict = str(assessment.get("verdict") or "").strip().lower()\n    worth_buying = assessment.get("worth_buying")\n    if explicit_status in {"FULL_APPROVED", "CONDITIONAL_APPROVED", "REJECTED"}:\n        execution_status = explicit_status\n    elif authorized:\n        execution_status = "FULL_APPROVED"\n    elif worth_buying is True or verdict in {"buy_by_plan", "conditional_buy", "watch"}:\n        execution_status = "CONDITIONAL_APPROVED"\n    else:\n        execution_status = "REJECTED"\n    conditional_entry_price = _finite(assessment.get("conditional_entry_price") or execution.get("conditional_entry_price"))\n    conditional_entry_reason = str(assessment.get("conditional_entry_reason") or execution.get("conditional_entry_reason") or "").strip() or None\n    return {\n        "execution_status": execution_status,\n        "execution_authorized": execution_status == "FULL_APPROVED",\n        "conditional_entry_price": conditional_entry_price,\n        "conditional_entry_reason": conditional_entry_reason,\n        "verdict": verdict or None,\n        "worth_buying": worth_buying if isinstance(worth_buying, bool) else None,\n    }\n\n'''
          if marker not in s:
              raise SystemExit("record_signal marker not found")
          s = s.replace(marker, "\n" + helper + "def record_signal(\n", 1)
          rep('''    key = signal_key(\n        session_date=session_date,\n        symbol=symbol,\n        policy_version=policy_version,\n        source_run_id=source_run_id,\n        signal_bar_time=bar_time.isoformat(),\n    )\n    with connect(path) as conn:\n''', '''    key = signal_key(\n        session_date=session_date,\n        symbol=symbol,\n        policy_version=policy_version,\n        source_run_id=source_run_id,\n        signal_bar_time=bar_time.isoformat(),\n    )\n    close_plan = _close_execution_contract(packet)\n    open_action = str(decision.get("action") or decision.get("status") or "").strip().upper()\n    transition = f"{close_plan['execution_status']}->{open_action or 'UNKNOWN'}"\n\n    with connect(path) as conn:\n''')
          rep('''                evaluated_at, signal_bar_time, signal_price,\n                decision_status, packet_json, snapshot_json, decision_json\n            ) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?)\n''', '''                evaluated_at, signal_bar_time, signal_price,\n                decision_status, packet_json, snapshot_json, decision_json,\n                close_plan_json, execution_transition\n            ) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)\n''')
          rep('''                _json(packet),\n                _json(snapshot),\n                _json(decision),\n            ),\n''', '''                _json(packet),\n                _json(snapshot),\n                _json(decision),\n                _json(close_plan),\n                transition,\n            ),\n''')
          rep('''        wait_rows = conn.execute(\n            """\n            SELECT better_entry_hit, best_future_improvement_pct,\n                   minutes_to_reference_better_price\n            FROM us_open_signals\n            WHERE decision_status='WAIT_BETTER_ENTRY' AND settled_at IS NOT NULL\n            ORDER BY session_date, symbol, id\n            """\n        ).fetchall()\n    close_returns = [float(row[0]) for row in buy_rows if row[0] is not None]\n''', '''        wait_rows = conn.execute(\n            """\n            SELECT better_entry_hit, best_future_improvement_pct,\n                   minutes_to_reference_better_price\n            FROM us_open_signals\n            WHERE decision_status='WAIT_BETTER_ENTRY' AND settled_at IS NOT NULL\n            ORDER BY session_date, symbol, id\n            """\n        ).fetchall()\n        transition_rows = conn.execute(\n            """\n            SELECT execution_transition, COUNT(*)\n            FROM us_open_signals\n            WHERE execution_transition IS NOT NULL\n              AND execution_transition <> ''\n            GROUP BY execution_transition\n            ORDER BY execution_transition\n            """\n        ).fetchall()\n    close_returns = [float(row[0]) for row in buy_rows if row[0] is not None]\n''')
          rep('''    wait_minutes = [float(row[2]) for row in wait_rows if row[2] is not None]\n    return {\n        "schema_version": SCHEMA_VERSION,\n''', '''    wait_minutes = [float(row[2]) for row in wait_rows if row[2] is not None]\n    execution_transition_stats = {\n        str(row[0]): int(row[1])\n        for row in transition_rows\n        if row[0]\n    }\n    return {\n        "schema_version": SCHEMA_VERSION,\n        "execution_transition_stats": execution_transition_stats,\n''')
          p.write_text(s, encoding="utf-8")

      - name: Commit research ledger
        run: |
          git add scripts/us_open_research_ledger.py
          git commit -m "feat: track close-to-open execution transitions"

      - name: Patch timing guard
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/run_us_open_timing.py")
          s = p.read_text(encoding="utf-8")
          marker = '\ndef _money(value: float | None) -> str:\n'
          helper = '''\ndef _enforce_execution_contract(decision: OpenTimingDecision) -> OpenTimingDecision:\n    if decision.action != "BUY_NOW" or decision.execution_status == "FULL_APPROVED":\n        return decision\n    payload = asdict(decision)\n    if decision.execution_status == "REJECTED":\n        payload.update(\n            action="NO_BUY",\n            label=ACTION_LABELS["NO_BUY"],\n            reason=decision.reason + "；收盘风险层已拒绝新仓，盘中不得绕过。",\n            starter_position_pct=0.0,\n            terminal=True,\n        )\n    else:\n        payload.update(\n            action="WAIT_CONFIRMATION",\n            label=ACTION_LABELS["WAIT_CONFIRMATION"],\n            reason=decision.reason + "；收盘仅为条件批准，尚未获得完全执行授权。",\n            starter_position_pct=0.0,\n            terminal=False,\n        )\n    return OpenTimingDecision(**payload)\n\n'''
          if marker not in s:
              raise SystemExit("timing helper marker not found")
          s = s.replace(marker, "\n" + helper + "def _money(value: float | None) -> str:\n", 1)
          old = '''        decisions.append(\n            _to_open_decision(packet, base, snapshot, evaluated_at=generated_at)\n        )\n'''
          new = '''        decision = _to_open_decision(\n            packet, base, snapshot, evaluated_at=generated_at\n        )\n        decisions.append(_enforce_execution_contract(decision))\n'''
          if old not in s:
              raise SystemExit("timing append pattern not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit timing guard
        run: |
          git add scripts/run_us_open_timing.py
          git commit -m "fix: enforce close-layer execution authorization in timing"

      - name: Patch confirmation guard
        shell: python
        run: |
          from pathlib import Path
          p = Path("scripts/run_us_open_confirmation.py")
          s = p.read_text(encoding="utf-8")
          old = '''    starter_pct = min(max(0.0, starter_position_pct), plan_max_pct)\n    return ConfirmationDecision(\n'''
          new = '''    if not prior_execution_authorized:\n        return ConfirmationDecision(\n            status="WAIT_STABILIZE",\n            label=STATUS_LABELS["WAIT_STABILIZE"],\n            reason=(\n                "盘中条件满足，但昨晚执行授权未通过；禁止直接买入，等待收盘层重新给出完全授权。"\n            ),\n            starter_position_pct=0.0,\n            **live,\n            **{key: value for key, value in base.items() if key != "starter_position_pct"},\n        )\n\n    starter_pct = min(max(0.0, starter_position_pct), plan_max_pct)\n    return ConfirmationDecision(\n'''
          if old not in s:
              raise SystemExit("confirmation pattern not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

      - name: Commit confirmation guard
        run: |
          git add scripts/run_us_open_confirmation.py
          git commit -m "fix: block unauthorized open confirmations"

      - name: Validate patched files
        run: |
          python -m py_compile scripts/us_open_research_ledger.py scripts/run_us_open_timing.py scripts/run_us_open_confirmation.py
          python - <<'PY'
          import importlib.util
          import json
          import tempfile
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          spec = importlib.util.spec_from_file_location("ledger", "scripts/us_open_research_ledger.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          with tempfile.TemporaryDirectory() as td:
              db = Path(td) / "ledger.db"
              ok = mod.record_signal(
                  db,
                  packet={
                      "identity": {"symbol": "TEST", "effective_trade_date": "2026-08-21"},
                      "assessment": {"execution_status": "CONDITIONAL_APPROVED", "execution_authorized": False, "worth_buying": True, "verdict": "conditional_buy"},
                      "execution": {},
                  },
                  snapshot={"last_bar_time": "2026-08-21T09:45:00-04:00", "current_price": 102.0},
                  decision={"action": "WAIT_BETTER_ENTRY", "expected_better_price": 100.0, "expected_wait_minutes": 30},
                  evaluated_at=datetime(2026,8,21,9,45,tzinfo=ZoneInfo("America/New_York")),
                  policy_version="smoke",
                  source_run_id="smoke",
              )
              assert ok
              summary = mod.summary(db)
              assert summary["execution_transition_stats"].get("CONDITIONAL_APPROVED->WAIT_BETTER_ENTRY") == 1
              print(json.dumps(summary, sort_keys=True))
          PY

      - name: Remove bootstrap workflow and push
        run: |
          git rm .github/workflows/v72_apply_execution_flow.yml
          git commit -m "chore: remove v7.2 patch bootstrap workflow"
          git push origin HEAD:feature/v7.2-decision-engine-upgrade
