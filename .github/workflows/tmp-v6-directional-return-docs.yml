name: Temporary V6 directional-return docs patch

on:
  push:
    branches:
      - fix/v6-accuracy-directional-returns

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch documentation and changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          doc_path = Path('docs/V6_ACCURACY_LAB.md')
          doc = doc_path.read_text(encoding='utf-8')

          replacements = {
              '- SPY excess return is not worse when benchmark data is available.':
                  '- direction-aware strategy SPY excess return is not worse when benchmark data is available.',
              'For every historical as-of date, this replay builds features only from observations available at or before that date, creates the Champion and all Challenger forecasts, then evaluates future 5/10/20 trading-bar returns. It also reports non-overlapping samples, Wilson intervals, yearly walk-forward results, and SPY excess return when benchmark history exists.':
                  'For every historical as-of date, this replay builds features only from observations available at or before that date, creates the Champion and all Challenger forecasts, then evaluates future 5/10/20 trading-bar returns. It also reports non-overlapping samples, Wilson intervals, yearly walk-forward results, and direction-aware strategy/SPY excess returns when benchmark history exists.\n\nHistorical replay maps each forecast to a simple gross research position: `bullish=+1x`, `bearish=-1x`, and `neutral=0x` (cash). `avg_return_pct` is the average return of that direction-aware position, while `avg_excess_vs_spy_pct` is that strategy return minus the contemporaneous long-only SPY return. This makes Champion/Challenger return and Alpha metrics variant-specific instead of reusing the same underlying stock return for every model.\n\nFor auditability, the JSON also preserves `avg_underlying_return_pct` and `avg_underlying_excess_vs_spy_pct`, which describe the underlying symbol path independent of forecast direction. Historical direction-strategy returns are gross of trading costs and are not a substitute for the separate cost-aware BUY_SETUP execution replay.',
              '3. compare SPY/QQQ excess return and trade-plan economics;':
                  '3. compare direction-aware SPY excess return and trade-plan economics;',
          }
          for old, new in replacements.items():
              if old not in doc:
                  raise SystemExit(f'docs replacement target missing: {old}')
              doc = doc.replace(old, new, 1)
          doc_path.write_text(doc, encoding='utf-8')

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '- [修复] V6.2 周度 Accuracy Replay 改为按各 Champion/Challenger 的预测方向计算无杠杆研究收益与 SPY 超额（bullish=+1x、bearish=-1x、neutral=现金），避免不同模型共享同一底层股票收益导致 Alpha 恒等；同时保留底层收益字段用于审计。\n'
          if entry not in changelog:
              marker = '## [Unreleased]\n\n'
              if marker not in changelog:
                  raise SystemExit('CHANGELOG [Unreleased] marker missing')
              changelog = changelog.replace(marker, marker + entry, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Commit docs and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-v6-directional-return-docs.yml
          git add docs/V6_ACCURACY_LAB.md docs/CHANGELOG.md
          git commit -m "docs(v6): define directional replay return metrics"
          git push origin HEAD:fix/v6-accuracy-directional-returns
