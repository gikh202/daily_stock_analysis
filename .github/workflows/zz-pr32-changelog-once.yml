name: PR32 changelog one-shot

on:
  push:
    branches:
      - agent/fix-v6-report-quality

permissions:
  contents: write

jobs:
  patch-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-v6-report-quality
          fetch-depth: 0
      - name: Insert only PR32 changelog entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          anchor = '## [Unreleased]\n\n'
          lines = (
              '- [修复] V6 最终统一日报过滤 `MARKET` 大盘复盘伪标的和“暂无已验证的近期证据”中性占位，稳定邮件 HTML 表格的独立表头/列布局；只调整融合输入与展示，不改变 `FinalDecisionPacket` 决策口径、机会/风险评分或执行授权。\n'
              '- [改进] 结构化 LiteLLM 恢复仅对原始响应已包含闭合 JSON 根对象的语法漂移执行本地 `json_repair`，并继续要求原 validator 通过；缺括号、未闭合字符串等疑似截断输出禁止本地自动补全，改走一次 evidence-aware 模型修复，避免不完整分析被误判成功。\n'
          )
          if lines.splitlines()[0] not in text:
              if anchor not in text:
                  raise SystemExit('missing Unreleased anchor')
              text = text.replace(anchor, anchor + lines, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit exact changelog patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CHANGELOG.md
          git rm .github/workflows/zz-pr32-changelog-once.yml
          git commit -m "docs(changelog): record V6 report quality fixes"
          git push origin HEAD:agent/fix-v6-report-quality
