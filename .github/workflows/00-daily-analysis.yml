name: 每日股票分析

on:
  # 定时触发 - 美股收盘后执行（UTC 22:30；北京时间次日 06:30）
  schedule:
    - cron: '30 22 * * 1-5'
  
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full          # 完整分析（股票+大盘）
          - market-only   # 仅大盘复盘
          - stocks-only   # 仅股票分析
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean
      restore_cache_key:
        description: '可选：精确恢复某个历史 data/ Cache Key；正常运行请留空'
        required: false
        default: ''
        type: string

# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    # 兼容误将 STOCK_LIST 配到同名 Environment variables 的场景；
    # 推荐位置仍是 Settings -> Secrets and variables -> Actions -> Repository variables。
    environment: STOCK_LIST
    # 添加超时限制，防止任务卡死
    timeout-minutes: ${{ fromJSON(vars.ANALYSIS_TIMEOUT_MINUTES || '30') }}
    
    steps:
      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 60))  # 随机延迟0-60秒启动
      
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import futu; print('✅ futu SDK import OK')"
      
      - name: 创建必要目录
        run: |
          mkdir -p data logs reports

      - name: 准确率增强预检
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/preflight_accuracy.py

      # 恢复历史分析数据库/快照，供历史对比与回测使用。
      #
      # 手动恢复旧历史：
      # workflow_dispatch 时填写 restore_cache_key，可精确恢复指定 Cache。
      # 正常定时/手动运行请留空，自动恢复最近一次有效 Cache。
      - name: 精确恢复指定历史分析数据
        id: restore-analysis-data-exact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.restore_cache_key != '' }}
        uses: actions/cache/restore@v5
        with:
          path: data/
          key: ${{ github.event.inputs.restore_cache_key }}
          fail-on-cache-miss: true

      - name: 恢复最近有效历史分析数据
        id: restore-analysis-data-latest
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.restore_cache_key == '' }}
        uses: actions/cache/restore@v5
        with:
          path: data/
          key: stock-analysis-data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-analysis-data-${{ runner.os }}-

      - name: 显示并校验历史数据恢复状态
        id: inspect-analysis-data
        shell: bash
        run: |
          echo "=========================================="
          echo "历史分析数据恢复状态"
          echo "=========================================="
          python - <<'PY'
          import os
          import sqlite3

          path = "data/stock_analysis.db"
          output = os.environ["GITHUB_OUTPUT"]

          def emit(name: str, value) -> None:
              with open(output, "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          if not os.path.isfile(path):
              print("未恢复到 stock_analysis.db：本轮将由程序按需新建。")
              emit("db_present", "false")
              emit("db_size", "0")
              emit("analysis_history_count", "-1")
              raise SystemExit(0)

          size = os.path.getsize(path)
          print(f"SQLite size: {size} bytes")
          if size < 4096:
              print(
                  f"::error::恢复的 SQLite 文件异常小：{size} bytes。"
                  "为避免历史数据被异常缓存污染，本轮停止。"
              )
              raise SystemExit(2)

          try:
              conn = sqlite3.connect(
                  f"file:{path}?mode=ro",
                  uri=True,
                  timeout=10,
              )
              try:
                  row = conn.execute("PRAGMA quick_check").fetchone()
                  quick_check = str(row[0]).strip().lower() if row else ""
                  tables = {
                      row[0]
                      for row in conn.execute(
                          "SELECT name FROM sqlite_master "
                          "WHERE type='table'"
                      )
                  }
                  history_count = (
                      int(
                          conn.execute(
                              "SELECT COUNT(*) FROM analysis_history"
                          ).fetchone()[0]
                      )
                      if "analysis_history" in tables
                      else -1
                  )
              finally:
                  conn.close()
          except Exception as exc:
              print(
                  "::error::恢复的 SQLite 无法读取或校验："
                  + str(exc)
              )
              raise SystemExit(2)

          if quick_check != "ok":
              print(
                  "::error::恢复的 SQLite quick_check 失败："
                  f"{quick_check!r}"
              )
              raise SystemExit(2)

          if not tables:
              print("::error::恢复的 SQLite 不包含任何数据表")
              raise SystemExit(2)

          print("SQLite quick_check: ok")
          print("SQLite tables:", len(tables))
          if history_count >= 0:
              print("analysis_history rows:", history_count)

          emit("db_present", "true")
          emit("db_size", size)
          emit("analysis_history_count", history_count)
          PY

      - name: 执行股票分析
        env:
          # ==========================================
          # AI 配置
          # ==========================================
          GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
          GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}
          GENERATION_BACKEND_TIMEOUT_SECONDS: ${{ vars.GENERATION_BACKEND_TIMEOUT_SECONDS || secrets.GENERATION_BACKEND_TIMEOUT_SECONDS }}
          GENERATION_BACKEND_MAX_OUTPUT_BYTES: ${{ vars.GENERATION_BACKEND_MAX_OUTPUT_BYTES || secrets.GENERATION_BACKEND_MAX_OUTPUT_BYTES }}
          GENERATION_BACKEND_MAX_CONCURRENCY: ${{ vars.GENERATION_BACKEND_MAX_CONCURRENCY || secrets.GENERATION_BACKEND_MAX_CONCURRENCY }}
          LOCAL_CLI_BACKEND_MAX_CONCURRENCY: ${{ vars.LOCAL_CLI_BACKEND_MAX_CONCURRENCY || secrets.LOCAL_CLI_BACKEND_MAX_CONCURRENCY }}
          AGENT_GENERATION_BACKEND: ${{ vars.AGENT_GENERATION_BACKEND || secrets.AGENT_GENERATION_BACKEND }}
          # LITELLM_CONFIG
          LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
          LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
          LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
          AGENT_LITELLM_MODEL: ${{ vars.AGENT_LITELLM_MODEL || secrets.AGENT_LITELLM_MODEL }}
          VISION_MODEL: ${{ vars.VISION_MODEL || secrets.VISION_MODEL }}
          OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || secrets.OPENAI_VISION_MODEL }}
          VISION_PROVIDER_PRIORITY: ${{ vars.VISION_PROVIDER_PRIORITY || secrets.VISION_PROVIDER_PRIORITY }}
          LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || secrets.LLM_TEMPERATURE }}
          LLM_USAGE_HMAC_SECRET: ${{ secrets.LLM_USAGE_HMAC_SECRET }}
          LLM_USAGE_HMAC_KEY_VERSION: ${{ vars.LLM_USAGE_HMAC_KEY_VERSION || secrets.LLM_USAGE_HMAC_KEY_VERSION }}
          LLM_PROMPT_CACHE_TELEMETRY_ENABLED: ${{ vars.LLM_PROMPT_CACHE_TELEMETRY_ENABLED || secrets.LLM_PROMPT_CACHE_TELEMETRY_ENABLED }}
          LLM_PROMPT_CACHE_HINTS_ENABLED: ${{ vars.LLM_PROMPT_CACHE_HINTS_ENABLED || secrets.LLM_PROMPT_CACHE_HINTS_ENABLED }}
          LLM_PROMPT_CACHE_DIAGNOSTICS_LEVEL: ${{ vars.LLM_PROMPT_CACHE_DIAGNOSTICS_LEVEL || secrets.LLM_PROMPT_CACHE_DIAGNOSTICS_LEVEL }}
