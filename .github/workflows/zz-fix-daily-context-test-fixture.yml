name: Temporary agent test fixture fix

on:
  push:
    branches:
      - agent/refactor-analysis-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-analysis-reliability
          fetch-depth: 0

      - name: Isolate daily-market guardrail test from data-quality guardrail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_agent_pipeline.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_analyze_with_agent_explains_daily_market_softening_before_risk(self):')
          end = text.index('\n    def ', start + 10)
          segment = text[start:end]
          old = "             patch('src.core.pipeline.SearchService'), \\\n             patch('src.core.pipeline.stabilize_decision_with_structure'), \\\n"
          new = "             patch('src.core.pipeline.SearchService'), \\\n             patch(\n                 'src.core.pipeline.render_analysis_context_pack_overview',\n                 return_value={\n                     'data_quality': {\n                         'overall_score': 95,\n                         'level': 'good',\n                         'limitations': [],\n                     }\n                 },\n             ), \\\n             patch('src.core.pipeline.stabilize_decision_with_structure'), \\\n"
          if segment.count(old) != 1:
              raise RuntimeError(f'expected one fixture insertion point, got {segment.count(old)}')
          segment = segment.replace(old, new, 1)
          text = text[:start] + segment + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tests/test_agent_pipeline.py
          git diff --check
          rm .github/workflows/zz-fix-daily-context-test-fixture.yml

      - name: Commit fixture fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_agent_pipeline.py .github/workflows/zz-fix-daily-context-test-fixture.yml
          git commit -m "test: isolate daily market context guardrail cause"
          git push origin HEAD:agent/refactor-analysis-reliability
