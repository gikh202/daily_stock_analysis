name: Temporary pipeline logger codemod

on:
  push:
    branches:
      - refactor/pipeline-market-data-stage

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/pipeline-market-data-stage
          fetch-depth: 0

      - name: Preserve pipeline logger seam
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/core/pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = """            resume_target_resolver=self._resolve_resume_target_date,\n        ).run(\n"""
          new = """            resume_target_resolver=self._resolve_resume_target_date,\n            stage_logger=logger,\n        ).run(\n"""
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one market-data stage delegate, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check
          git diff -- src/core/pipeline.py

      - name: Commit codemod result
        shell: bash
        run: |
          if git diff --quiet -- src/core/pipeline.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/pipeline.py
          git commit -m "fix: preserve pipeline logger seam"
          git push origin HEAD:refactor/pipeline-market-data-stage
