name: V7 history path patch

on:
  push:
    branches:
      - refactor/v7-forecast-decision-architecture
    paths:
      - '.github/workflows/zz-v7-history-path-patch.yml'

permissions:
  contents: write

jobs:
  patch-history-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: refactor/v7-forecast-decision-architecture
          fetch-depth: 0

      - name: Bind forecast history to production DB and remove this workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/v6_daily/production_runner.py')
          text = path.read_text(encoding='utf-8')
          old = '    engine = V6DailyEngine()\n'
          new = '    engine = V6DailyEngine(history_db_path=v6_db_path)\n'
          if old not in text:
              raise SystemExit('Stage 11 engine construction not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/zz-v7-history-path-patch.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v6_daily/production_runner.py
          git commit -m 'fix: bind V7 calibration to Stage 11 database'
          git push origin HEAD:refactor/v7-forecast-decision-architecture
