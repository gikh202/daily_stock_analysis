name: One-time V6.3 changelog update

on:
  push:
    branches:
      - feature/v6-3-alpha-target-lab

permissions:
  contents: write

jobs:
  update-changelog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/v6-3-alpha-target-lab
          fetch-depth: 1

      - name: Add Unreleased entry and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '- [新功能] V6.3 Alpha Target Lab 在周度严格 no-lookahead 回放中新增相对 SPY 的方向目标、0–2/2–5/5–10/10pt+ 固定分数余量校准桶与按 as-of SPY 趋势/波动划分的 Regime Matrix；统一报告 Wilson 95% CI 和方向化 Alpha Spread，保持 Champion、生产阈值、自动调权/晋级与既有 Promotion Gate 不变。'
          if entry not in text:
              marker = '## [Unreleased]\n\n'
              if text.count(marker) != 1:
                  raise SystemExit('expected exactly one Unreleased marker')
              text = text.replace(marker, marker + entry + '\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/zz-v6-changelog-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHANGELOG.md
          git diff --cached --check
          git commit -m 'docs: add V6.3 changelog entry'
          git push origin HEAD:feature/v6-3-alpha-target-lab
