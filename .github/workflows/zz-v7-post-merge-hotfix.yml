                },
                "numeric_llm_influence": "none",
""",
          )

          # 3) Decision gates are authoritative: no calibration / low confidence / no alpha / poor R:R => no new exposure.
          old_decision = """        constructive = bool(h5.probability_up >= 0.58 and h5.expected_return_pct > 0.35 and h5.expected_alpha_vs_spy_pct > 0.0 and h20.probability_up >= 0.52 and h20.expected_return_pct >= 0.0 and reward_risk >= 1.15 and confidence >= 0.50 and risk <= 60.0)
        watchable = bool(h5.probability_up >= 0.52 and h5.expected_return_pct > 0.0 and h20.probability_up >= 0.48 and risk <= 68.0)
        bearish = bool(h5.probability_up <= 0.42 and h5.expected_return_pct < 0.0 and h20.probability_up <= 0.47)
        if constructive:
            decision = "BUY_SETUP"
            rationale = f"5D calibrated P(up)={h5.probability_up:.1%}, expected return {h5.expected_return_pct:+.2f}%, expected alpha {h5.expected_alpha_vs_spy_pct:+.2f}%, distribution R/R={reward_risk:.2f}"
        elif bearish:
            decision = "AVOID"
            rationale = f"5D/20D calibrated probabilities are bearish ({h5.probability_up:.1%}/{h20.probability_up:.1%}) with negative expected return"
        elif watchable:
            decision = "WATCH"
            rationale = f"forecast is constructive but edge is not strong enough for immediate setup: 5D P(up)={h5.probability_up:.1%}, return={h5.expected_return_pct:+.2f}%, alpha={h5.expected_alpha_vs_spy_pct:+.2f}%"
        else:
            decision = "WAIT"
            rationale = f"forecast edge is insufficient: 5D P(up)={h5.probability_up:.1%}, return={h5.expected_return_pct:+.2f}%, alpha={h5.expected_alpha_vs_spy_pct:+.2f}%"
"""
          new_decision = """        bearish = bool(h5.probability_up <= 0.42 and h5.expected_return_pct < 0.0 and h20.probability_up <= 0.47)
        constructive = bool(h5.probability_up >= 0.58 and h5.expected_return_pct > 0.35 and h5.expected_alpha_vs_spy_pct > 0.0 and h20.probability_up >= 0.52 and h20.expected_return_pct >= 0.0 and reward_risk >= 1.15 and confidence >= 0.50 and risk <= 60.0)
        watchable = bool(h5.probability_up >= 0.52 and h5.expected_return_pct > 0.0 and h20.probability_up >= 0.48 and risk <= 68.0)
        if bearish:
            decision = "AVOID"
            rationale = f"5D/20D calibrated probabilities are bearish ({h5.probability_up:.1%}/{h20.probability_up:.1%}) with negative expected return"
        elif gates:
            decision = "WAIT"
            rationale = "execution gates block new exposure: " + ", ".join(gates)
        elif constructive:
            decision = "BUY_SETUP"
            rationale = f"5D calibrated P(up)={h5.probability_up:.1%}, expected return {h5.expected_return_pct:+.2f}%, expected alpha {h5.expected_alpha_vs_spy_pct:+.2f}%, distribution R/R={reward_risk:.2f}"
        elif watchable:
            decision = "WATCH"
            rationale = f"forecast is constructive but edge is not strong enough for immediate setup: 5D P(up)={h5.probability_up:.1%}, return={h5.expected_return_pct:+.2f}%, alpha={h5.expected_alpha_vs_spy_pct:+.2f}%"
        else:
            decision = "WAIT"
            rationale = f"forecast edge is insufficient: 5D P(up)={h5.probability_up:.1%}, return={h5.expected_return_pct:+.2f}%, alpha={h5.expected_alpha_vs_spy_pct:+.2f}%"
"""
          replace('src/forecasting/decision.py', old_decision, new_decision)

          # 4) Better-entry output is explicitly an uncalibrated heuristic score until the ledger supports calibration.
          replace('src/forecasting/timing.py', '    version = "v7.0-intraday-timing.1"', '    version = "v7.1-intraday-timing.1"\n    better_entry_metric = "heuristic_score_v1"')
          replace('src/forecasting/timing.py', 'f"near-term pullback probability {better:.1%} with estimated {expected_improvement:.2f}% price improvement; expected value favors waiting"', 'f"near-term better-entry heuristic score {better:.1%} with estimated {expected_improvement:.2f}% price improvement; expected value favors waiting"')
          replace('src/forecasting/timing.py', 'f"waiting edge is not material (better-entry probability {better:.1%}, estimated improvement {expected_improvement:.2f}%); current setup remains executable"', 'f"waiting edge is not material (better-entry heuristic score {better:.1%}, estimated improvement {expected_improvement:.2f}%); current setup remains executable"')

          replace('scripts/run_us_open_timing.py', 'POLICY_VERSION="us-open-timing-v7.0"', 'POLICY_VERSION="us-open-timing-v7.1"')
          replace('scripts/run_us_open_timing.py', 'forecast_confidence:float|None; better_entry_probability:float;', 'forecast_confidence:float|None; better_entry_score:float; better_entry_probability:float;')
          replace('scripts/run_us_open_timing.py', 'starter_position_pct=0.0,better_entry_probability=0.0,expected_better_price=None', 'starter_position_pct=0.0,better_entry_score=0.0,better_entry_probability=0.0,expected_better_price=None')
          replace('scripts/run_us_open_timing.py', 'starter_position_pct=base.starter_position_pct if timing.action=="BUY_NOW" else 0.0,better_entry_probability=timing.better_entry_probability,expected_better_price=', 'starter_position_pct=base.starter_position_pct if timing.action=="BUY_NOW" else 0.0,better_entry_score=timing.better_entry_probability,better_entry_probability=timing.better_entry_probability,expected_better_price=')
          replace('scripts/run_us_open_timing.py', '更好买点概率 | 预计更优价', '更好买点评分* | 预计更优价')
          replace('scripts/run_us_open_timing.py', '_pct(x.better_entry_probability,probability=True)', '_pct(x.better_entry_score,probability=True)')
          replace('scripts/run_us_open_timing.py', '未来近端出现更好买点概率 {_pct(x.better_entry_probability,probability=True)}', '更好买点启发式评分（未校准） {_pct(x.better_entry_score,probability=True)}')
          replace(
              'scripts/run_us_open_timing.py',
              '"- 概率和期望收益是基于历史校准的估计，不是收益保证。",""]',
              '"- 收盘层上涨概率和期望收益来自历史校准，不是收益保证。","- `更好买点评分` 当前是盘中启发式 score，不是校准概率；Research Ledger 会按多时点 outcome 验证，样本不足前不得表述为胜率。",""]',
          )

          signature_code = r'''def _semantic_price_state(current_price:float|None,entry_low:float|None,entry_high:float|None,stop_loss:float|None)->str:
    price=_finite(current_price); low=_finite(entry_low); high=_finite(entry_high); stop=_finite(stop_loss)
    if price is None:return "unknown"
    if stop is not None and price<=stop:return "at_or_below_stop"
    if low is not None and high is not None:
        if price<low:return "below_entry"
        if price<=high:return "inside_entry"
        premium=(price/high-1.0)*100.0 if high>0 else 0.0
        if premium<0.5:return "above_entry_lt_0_5pct"
        if premium<1.0:return "above_entry_0_5_1pct"
        if premium<2.0:return "above_entry_1_2pct"
        return "above_entry_ge_2pct"
    return "priced"

def _signature(decisions:Sequence[OpenTimingDecision])->str:
    compact=[{"symbol":x.symbol,"action":x.action,"better_bucket":min(9,max(0,int(x.better_entry_score*10.0))),"price_state":_semantic_price_state(x.current_price,x.entry_low,x.entry_high,x.stop_loss)} for x in decisions]
    return hashlib.sha256(json.dumps(compact,sort_keys=True,ensure_ascii=False).encode()).hexdigest()[:16]
'''
          regex_replace('scripts/run_us_open_timing.py', r'def _signature\(decisions:Sequence\[OpenTimingDecision\]\)->str:.*?(?=\ndef _read_previous)', signature_code)
          regex_replace(
              'scripts/run_us_open_timing.py',
              r'def _should_notify\(previous:Mapping\[str,Any\]\|None,\*,signature:str,generated_at:datetime,force:bool\)->bool:.*?(?=\ndef _notify)',
              '''def _should_notify(previous:Mapping[str,Any]|None,*,signature:str,generated_at:datetime,force:bool)->bool:\n    del generated_at\n    if force or not previous:return True\n    return str(previous.get("state_signature") or "")!=signature\n''',
          )
          replace(
              'scripts/run_us_open_timing.py',
              'payload={"version":"us-open-timing-v7","policy_version":POLICY_VERSION,',
              'payload={"version":"us-open-timing-v7.1","policy_version":POLICY_VERSION,"better_entry_metric":{"field":"better_entry_score","legacy_alias":"better_entry_probability","semantics":"heuristic_score","calibrated":False},',
          )

          # 5) Research ledger v2: restore V7 artifact chain, capture every fresh bar, learn whether waiting found a better entry.
          replace('scripts/us_open_research_ledger.py', 'SCHEMA_VERSION = "us-open-research-ledger-v1"', 'SCHEMA_VERSION = "us-open-research-ledger-v2"')
          regex_replace(
              'scripts/us_open_research_ledger.py',
              r'def connect\(path: str \| Path\) -> sqlite3.Connection:.*?(?=\ndef signal_key)',
              r'''def connect(path: str | Path) -> sqlite3.Connection:
    db = Path(path)
    db.parent.mkdir(parents=True, exist_ok=True)
    conn = sqlite3.connect(str(db), timeout=30)
    conn.row_factory = sqlite3.Row
    conn.execute("PRAGMA journal_mode=DELETE")
    conn.execute("PRAGMA synchronous=FULL")
    conn.execute("PRAGMA busy_timeout=30000")
    conn.executescript(
        """
        CREATE TABLE IF NOT EXISTS us_open_signals (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            schema_version TEXT NOT NULL,
            signal_key TEXT NOT NULL UNIQUE,
            session_date TEXT NOT NULL,
            symbol TEXT NOT NULL,
            policy_version TEXT NOT NULL,
            source_run_id TEXT,
            source_trade_date TEXT,
            evaluated_at TEXT NOT NULL,
            signal_bar_time TEXT NOT NULL,
            signal_price REAL NOT NULL,
            decision_status TEXT NOT NULL,
            packet_json TEXT NOT NULL,
            snapshot_json TEXT NOT NULL,
            decision_json TEXT NOT NULL,
            settled_at TEXT,
            close_return_pct REAL,
            return_60m_pct REAL,
            mfe_pct REAL,
            mae_pct REAL,
            stop_hit INTEGER,
            target1_hit INTEGER,
            first_touch TEXT,
            modeled_exit_return_pct REAL,
            better_entry_hit INTEGER,
            best_future_improvement_pct REAL,
            minutes_to_reference_better_price REAL,
            outcome_json TEXT
        );
        CREATE INDEX IF NOT EXISTS ix_us_open_signals_date_symbol
            ON us_open_signals(session_date, symbol, id);
        CREATE INDEX IF NOT EXISTS ix_us_open_signals_status_settled
            ON us_open_signals(decision_status, settled_at, session_date);
        """
    )
    columns = {str(row["name"]) for row in conn.execute("PRAGMA table_info(us_open_signals)")}
    for name, ddl in {
        "better_entry_hit": "INTEGER",
        "best_future_improvement_pct": "REAL",
        "minutes_to_reference_better_price": "REAL",
    }.items():
        if name not in columns:
            conn.execute(f"ALTER TABLE us_open_signals ADD COLUMN {name} {ddl}")
    return conn
''',
          )
          regex_replace(
              'scripts/us_open_research_ledger.py',
              r'def signal_key\(.*?(?=\ndef record_signal)',
              r'''def signal_key(*, session_date: str, symbol: str, policy_version: str, source_run_id: str | None, signal_bar_time: str | None = None) -> str:
    return "|".join(
        [
            session_date,
            symbol.strip().upper(),
            policy_version.strip(),
            str(source_run_id or "").strip(),
            str(signal_bar_time or "").strip(),
        ]
    )
''',
          )
          replace(
              'scripts/us_open_research_ledger.py',
              'source_run_id=source_run_id,\n    )',
              'source_run_id=source_run_id,\n        signal_bar_time=bar_time.isoformat(),\n    )',
          )
          replace('scripts/us_open_research_ledger.py', 'str(decision.get("status") or ""),', 'str(decision.get("action") or decision.get("status") or ""),')

          regex_replace(
              'scripts/us_open_research_ledger.py',
              r'def compute_outcome\(row: Mapping\[str, Any\], frame: Any\) -> dict\[str, Any\] \| None:.*?(?=\ndef settle_pending)',
              r'''def compute_outcome(row: Mapping[str, Any], frame: Any) -> dict[str, Any] | None:
    frame = _normalize_frame(frame)
    if frame is None or frame.empty:
        return None
    signal_time = _parse_dt(row.get("signal_bar_time"))
    signal_price = _finite(row.get("signal_price"))
    if signal_time is None or signal_price is None or signal_price <= 0:
        return None
    session = frame[frame.index.date == signal_time.date()].between_time("09:30", "16:00")
    future = session[session.index > signal_time]
    if future.empty:
        return None
    close_price = _finite(session.iloc[-1].get("Close"))
    if close_price is None or close_price <= 0:
        return None

    future_high = float(future["High"].max())
    future_low = float(future["Low"].min())
    close_return = (close_price / signal_price - 1.0) * 100.0
    mfe = (future_high / signal_price - 1.0) * 100.0
    mae = (future_low / signal_price - 1.0) * 100.0
    best_future_improvement = max(0.0, (signal_price - future_low) / signal_price * 100.0)

    cutoff = signal_time + timedelta(minutes=60)
    first_hour = future[future.index <= cutoff]
    return_60m = None
    if not first_hour.empty:
        hour_price = _finite(first_hour.iloc[-1].get("Close"))
        if hour_price is not None and hour_price > 0:
            return_60m = (hour_price / signal_price - 1.0) * 100.0

    try:
        packet = json.loads(str(row.get("packet_json") or "{}"))
    except json.JSONDecodeError:
        packet = {}
    try:
        decision = json.loads(str(row.get("decision_json") or "{}"))
    except json.JSONDecodeError:
        decision = {}
    stop, target1 = _execution_levels(packet)
    reference_better_price = _finite(decision.get("expected_better_price"))
    better_entry_hit = None
    minutes_to_reference = None
    if reference_better_price is not None and 0 < reference_better_price < signal_price:
        matching = future[future["Low"] <= reference_better_price]
        better_entry_hit = not matching.empty
        if better_entry_hit:
            first_time = matching.index[0]
            minutes_to_reference = max(0.0, (first_time - signal_time).total_seconds() / 60.0)

    stop_hit = False
    target1_hit = False
    first_touch = "close"
    modeled_exit = close_return
    for _, bar in future.iterrows():
        low = _finite(bar.get("Low"))
        high = _finite(bar.get("High"))
        stop_here = bool(stop is not None and low is not None and low <= stop)
        target_here = bool(target1 is not None and high is not None and high >= target1)
        stop_hit = stop_hit or stop_here
        target1_hit = target1_hit or target_here
        if stop_here and target_here:
            first_touch = "ambiguous_stop_target_same_bar"
            modeled_exit = None
            break
        if stop_here:
            first_touch = "stop"
            modeled_exit = (stop / signal_price - 1.0) * 100.0 if stop is not None else None
            break
