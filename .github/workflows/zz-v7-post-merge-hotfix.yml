class _PerHorizonHistory:
    available = True
    def select_champion(self, *, horizon_days, **kwargs):
        promoted = horizon_days == 5
        return {"champion_model": "momentum_challenger" if promoted else "calibrated_ensemble", "challenger_model": "calibrated_ensemble" if promoted else "momentum_challenger", "status": "promoted" if promoted else "observing", "paired_samples": 250}
    def calibration(self, *, raw_probability_up, probability_key, **kwargs):
        return CalibrationProfile("mature", 250, 250, raw_probability_up, 1.0, .5, 2.0, -1.0, -1.0, 1.0, 3.0, .20, .50, .05, probability_key)


def test_champion_selection_is_independent_per_horizon() -> None:
    bundle = V7ForecastEngine(history=_PerHorizonHistory()).forecast(symbol="TEST", instrument_type="STOCK", effective_trade_date="2026-08-20", context={}, features=AlphaFeatures(trend=70, momentum=65, relative_strength=60, volume_confirmation=60, market_regime=60), market_regime="risk_on", atr=2.0, current_price=100.0)
    assert bundle.horizons["1d"].champion_model == "calibrated_ensemble"
    assert bundle.horizons["5d"].champion_model == "momentum_challenger"
    assert bundle.horizons["10d"].champion_model == "calibrated_ensemble"
    assert bundle.horizons["20d"].champion_model == "calibrated_ensemble"
    assert bundle.champion_model == "momentum_challenger"


def _forecast_horizon(days: int, *, status: str = "mature", confidence: float = .8) -> ForecastHorizon:
    return ForecastHorizon(horizon_days=days, raw_probability_up=.7, probability_up=.7, expected_return_pct=1.2, expected_alpha_vs_spy_pct=.6, p10_return_pct=-1.0, p50_return_pct=1.2, p90_return_pct=3.0, expected_mfe_pct=2.0, expected_mae_pct=-.8, evidence_coverage=.9, forecast_confidence=confidence, calibration_samples=50 if status != "prior_only" else 0, calibration_status=status, regime="risk_on", champion_model="calibrated_ensemble", challenger_model="momentum_challenger", challenger_probability_up=.65, direction="bullish", score=70.0)


def _bundle(*, status: str = "mature", confidence: float = .8) -> ForecastBundle:
    horizons = {f"{days}d": _forecast_horizon(days, status=status if days == 5 else "mature", confidence=confidence) for days in (1, 5, 20)}
    return ForecastBundle("TEST", "STOCK", "2026-08-20", "risk_on", "test", horizons, "5d", "calibrated_ensemble", "momentum_challenger", "observing", .9)


