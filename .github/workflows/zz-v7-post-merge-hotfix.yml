name: Apply V7 post-merge audit fixes

on:
  push:
    branches: [fix/v7-post-merge-audit]
    paths: ['.github/workflows/zz-v7-post-merge-hotfix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v7-post-merge-audit
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply audited fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace(path, old, new, count=1):
              text = load(path)
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:100]!r}')
              save(path, text.replace(old, new, count))

          def regex_replace(path, pattern, new):
              text = load(path)
              text2, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: regex replacement count={count}: {pattern[:100]!r}')
              save(path, text2)

          # 1) Strict no-lookahead: invalid/missing source dates are never eligible.
          replace(
              'src/forecasting/history.py',
              """                    WHERE o.horizon_days=? AND o.end_trade_date < ?
                      AND COALESCE(f.effective_trade_date, '') < ?
""",
              """                    WHERE o.horizon_days=?
                      AND date(o.end_trade_date) IS NOT NULL
                      AND date(o.end_trade_date) < date(?)
                      AND date(f.effective_trade_date) IS NOT NULL
                      AND date(f.effective_trade_date) < date(?)
""",
          )

          paired_selection = r'''    def paired_model_metrics(
        self,
        *,
        as_of_date: str | None,
        horizon_days: int,
        regime: str | None = None,
    ) -> Dict[str, Any]:
        """Compare Champion/Challenger only on rows where both predictions exist."""
        if _valid_date(as_of_date) is None:
            return {
                "samples": 0,
                "champion_brier_score": None,
                "challenger_brier_score": None,
                "champion_log_loss": None,
                "challenger_log_loss": None,
            }
        rows = self._rows(as_of_date=as_of_date, horizon_days=horizon_days)
        if regime:
            key = str(regime).strip().lower()
            rows = [
                row for row in rows
                if str(row["market_regime"] or "unknown").strip().lower() == key
            ]
        paired: list[tuple[float, float, int]] = []
        for row in rows:
            champion_p = self._row_probability(row, "probability_up")
            challenger_p = self._row_probability(row, "challenger_probability_up")
            ret = _finite(row["return_pct"])
            if champion_p is None or challenger_p is None or ret is None:
                continue
            paired.append((champion_p, challenger_p, int(ret > 0.0)))
        if not paired:
            return {
                "samples": 0,
                "champion_brier_score": None,
                "challenger_brier_score": None,
                "champion_log_loss": None,
                "challenger_log_loss": None,
            }
        return {
            "samples": len(paired),
            "champion_brier_score": statistics.fmean((p-y)**2 for p, _, y in paired),
            "challenger_brier_score": statistics.fmean((p-y)**2 for _, p, y in paired),
            "champion_log_loss": statistics.fmean(_log_loss(p, y) for p, _, y in paired),
            "challenger_log_loss": statistics.fmean(_log_loss(p, y) for _, p, y in paired),
        }

    def select_champion(
        self,
        *,
        as_of_date: str | None,
        horizon_days: int,
        regime: str,
        min_promotion_samples: int = 200,
        min_brier_improvement: float = 0.01,
    ) -> Dict[str, Any]:
        paired = self.paired_model_metrics(
            as_of_date=as_of_date,
            horizon_days=horizon_days,
            regime=regime,
        )
        champion = {
            "samples": paired["samples"],
            "brier_score": paired["champion_brier_score"],
            "log_loss": paired["champion_log_loss"],
        }
        challenger = {
            "samples": paired["samples"],
            "brier_score": paired["challenger_brier_score"],
            "log_loss": paired["challenger_log_loss"],
        }
        promote = bool(
            paired["samples"] >= int(min_promotion_samples)
            and champion["brier_score"] is not None
            and challenger["brier_score"] is not None
            and challenger["brier_score"]
            <= champion["brier_score"] - float(min_brier_improvement)
        )
        return {
            "champion_model": "momentum_challenger" if promote else "calibrated_ensemble",
            "challenger_model": "calibrated_ensemble" if promote else "momentum_challenger",
            "status": "promoted" if promote else ("observing" if paired["samples"] else "cold_start"),
            "promotion_min_samples": int(min_promotion_samples),
            "min_brier_improvement": float(min_brier_improvement),
            "evaluation_basis": "paired_forward_only",
            "paired_samples": paired["samples"],
            "champion_metrics": champion,
            "challenger_metrics": challenger,
        }
'''
          regex_replace(
              'src/forecasting/history.py',
              r'    def select_champion\(.*\Z',
              paired_selection,
          )

          # 2) Forecast version bump and per-horizon Champion/Challenger selection.
          replace('src/forecasting/engine.py', 'V7_FORECAST_VERSION = "v7.0-forecast.1"', 'V7_FORECAST_VERSION = "v7.1-forecast.1"')
          replace('src/v6_daily/engine.py', 'V6_ENGINE_VERSION = "v7.0-forecast.1"', 'V6_ENGINE_VERSION = "v7.1-forecast.1"')
          replace(
              'src/forecasting/engine.py',
              """        selection = self.history.select_champion(
            as_of_date=as_of,
            horizon_days=5,
            regime=regime,
        )
        selected_champion = str(selection["champion_model"])
        selected_challenger = str(selection["challenger_model"])
        challenger_active = selected_champion == "momentum_challenger"

        horizons: Dict[str, ForecastHorizon] = {}
        for horizon in FORECAST_HORIZONS:
""",
              """        selections: Dict[int, Dict[str, Any]] = {}
        horizons: Dict[str, ForecastHorizon] = {}
        for horizon in FORECAST_HORIZONS:
            selection = self.history.select_champion(
                as_of_date=as_of,
                horizon_days=horizon,
                regime=regime,
            )
            selections[horizon] = selection
            selected_champion = str(selection["champion_model"])
            selected_challenger = str(selection["challenger_model"])
            challenger_active = selected_champion == "momentum_challenger"
""",
          )
          replace(
              'src/forecasting/engine.py',
              """        coverage = sum(item.evidence_coverage for item in horizons.values()) / len(horizons)
        return ForecastBundle(
