name: V6 Accuracy Changelog One-shot

on:
  push:
    branches:
      - 'feature/v6-2-accuracy-lab'

permissions:
  contents: write

jobs:
  patch-changelog:
    if: github.ref_name == 'feature/v6-2-accuracy-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/v6-2-accuracy-lab
          fetch-depth: 0

      - name: Insert flat Unreleased entry and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          entry = '- [新功能] V6.2 Accuracy Lab 新增 95% Wilson 置信区间、5D/10D/20D 非重叠样本验证、BUY_SETUP 保守执行回测、Champion/Challenger Shadow、严格 no-lookahead 周度回放与研究型晋级门禁；正式 Champion 权重、自动调权和自动晋级保持关闭。'
          if entry not in text:
              marker = '## [Unreleased]\n\n'
              if marker not in text:
                  raise SystemExit('CHANGELOG [Unreleased] marker not found')
              text = text.replace(marker, marker + entry + '\n', 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/99-v6-accuracy-changelog-fix.yml

      - name: Commit changelog patch
        shell: bash
        run: |
          if git diff --quiet -- docs/CHANGELOG.md .github/workflows/99-v6-accuracy-changelog-fix.yml; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CHANGELOG.md .github/workflows/99-v6-accuracy-changelog-fix.yml
          git commit -m 'docs(v6): record Accuracy Lab upgrade'
          git push origin HEAD:feature/v6-2-accuracy-lab
