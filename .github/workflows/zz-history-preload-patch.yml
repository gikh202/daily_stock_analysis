name: Temporary initial history preload patch

on:
  push:
    branches:
      - agent/refactor-analysis-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-analysis-reliability
          fetch-depth: 0

      - name: Expand initial daily history preload
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("src/core/pipeline.py"); s=p.read_text(encoding="utf-8"); old="df, source_name = self.fetcher_manager.get_daily_data(code, days=30)"; new="df, source_name = self.fetcher_manager.get_daily_data(code, days=60)"; assert s.count(old) == 1, f"expected one preload call, got {s.count(old)}"; p.write_text(s.replace(old, new, 1), encoding="utf-8")'
          rm .github/workflows/zz-history-preload-patch.yml
          python -m py_compile src/core/pipeline.py
          git diff --check

      - name: Commit preload fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/pipeline.py .github/workflows/zz-history-preload-patch.yml
          git commit -m "fix: preload enough history for real MA60"
          git push origin HEAD:agent/refactor-analysis-reliability
