name: V5 Alpha Engine CI

on:
  pull_request:
    paths:
      - 'src/alpha_engine/**'
      - 'scripts/run_alpha_shadow.py'
      - 'tests/test_alpha_*.py'
      - '.github/workflows/ci-alpha-engine.yml'
      - '.github/workflows/01-alpha-shadow.yml'
  push:
    branches:
      - 'feature/v5-alpha-engine'
    paths:
      - 'src/alpha_engine/**'
      - 'scripts/run_alpha_shadow.py'
      - 'tests/test_alpha_*.py'
      - '.github/workflows/ci-alpha-engine.yml'
      - '.github/workflows/01-alpha-shadow.yml'

permissions:
  contents: read

concurrency:
  group: alpha-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  alpha-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Alpha modules
        run: |
          python -m py_compile \
            src/alpha_engine/__init__.py \
            src/alpha_engine/models.py \
            src/alpha_engine/engine.py \
            src/alpha_engine/features.py \
            src/alpha_engine/portfolio.py \
            src/alpha_engine/shadow_store.py \
            scripts/run_alpha_shadow.py

      - name: Run isolated Alpha tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          pytest -q --noconftest
          tests/test_alpha_engine.py
          tests/test_alpha_features.py
          tests/test_alpha_portfolio.py
          tests/test_alpha_shadow_store.py
          tests/test_alpha_shadow_runner.py
