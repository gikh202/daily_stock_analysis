name: Temporary PR35 test contract patch

on:
  push:
    branches:
      - agent/unified-signal-policy-live-smoke

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/unified-signal-policy-live-smoke
          fetch-depth: 0

      - name: Update Initial v2 metadata expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_decision_signal_api.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert payload["item"]["metadata"]["signal_generation_version"] == "legacy-report-extractor-v1"\n    assert "scoring_breakdown" not in payload["item"]["metadata"]\n'''
          new = '''    assert payload["item"]["metadata"]["signal_generation_version"] == "decision-profile-initial-v2"\n    assert payload["item"]["metadata"]["scoring_breakdown"]\n    assert payload["item"]["metadata"]["guardrail_result"]\n'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f"Expected exactly 2 stale metadata assertion blocks, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          git diff --check

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz-fix-pr35-test-contract.yml
          git add tests/test_decision_signal_api.py
          git diff --cached --check
          git commit -m "test: align reused auto signal metadata with initial v2"
          git push origin HEAD:agent/unified-signal-policy-live-smoke
