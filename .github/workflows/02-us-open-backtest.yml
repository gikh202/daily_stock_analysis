name: 美股开盘确认回测

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/02-us-open-backtest.yml'
      - '.github/workflows/01-us-open-confirmation.yml'
      - '.github/workflows/02b-us-open-research-ledger.yml'
      - 'src/forecasting/**'
      - 'src/v6_daily/engine.py'
      - 'scripts/backtest_us_open_confirmation.py'
      - 'scripts/backtest_wait_better_entry.py'
      - 'scripts/probe_us_open_conservative.py'
      - 'scripts/probe_us_open_v2.py'
      - 'scripts/run_us_open_confirmation.py'
      - 'scripts/run_us_open_confirmation_v2.py'
      - 'scripts/run_us_open_confirmation_safe.py'
      - 'scripts/run_us_open_timing.py'
      - 'scripts/send_us_open_failure_alert.py'
      - 'scripts/us_open_research_ledger.py'
      - 'scripts/capture_us_open_research.py'
      - 'tests/test_notification_streamlining.py'
      - 'tests/test_us_open_confirmation.py'
      - 'tests/test_us_open_confirmation_v2.py'
      - 'tests/test_us_open_email_delivery_contract.py'
      - 'tests/test_v7_forecast_calibration.py'
      - 'tests/test_v7_intraday_timing.py'
      - 'tests/test_v7_wait_better_entry_settlement.py'
      - 'tests/test_us_open_research_ledger.py'
      - 'tests/test_us_open_policy_probe.py'
      - 'tests/test_us_open_research_workflow_contract.py'

permissions:
  contents: read
  actions: read

jobs:
  backtest-us-open:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pytest python-dotenv

      - name: Validate production-policy, V7 forecast and runtime workflow rules
        run: |
          python -m pytest -q --noconftest \
            tests/test_notification_streamlining.py \
            tests/test_us_open_confirmation.py \
            tests/test_us_open_confirmation_v2.py \
            tests/test_us_open_email_delivery_contract.py \
            tests/test_v7_forecast_calibration.py \
            tests/test_v7_intraday_timing.py \
            tests/test_v7_wait_better_entry_settlement.py \
            tests/test_us_open_research_ledger.py \
            tests/test_us_open_policy_probe.py \
            tests/test_us_open_research_workflow_contract.py

      - name: Find latest successful V6/V7 artifact
        id: prior-v6
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '03-v6-daily.yml',
              branch: 'main',
              status: 'completed',
              per_page: 50,
            });
            const run = (response.data.workflow_runs || [])
              .filter((item) => item.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!run) {
              core.setFailed('No successful close forecast run found on main.');
              return;
            }
            core.info(`Using close forecast run ${run.id} created_at=${run.created_at}`);
            core.setOutput('run_id', String(run.id));

      - name: Download V6/V7 history artifact
        uses: actions/download-artifact@v5
        with:
          pattern: v6-daily-*
          path: prior_v6
          merge-multiple: true
          run-id: ${{ steps.prior-v6.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate forecast database
        id: db
        shell: bash
        run: |
          set -euo pipefail
          DB="$(find prior_v6 -type f -name 'v6_daily.db' -print | head -n 1 || true)"
          if [ -z "$DB" ]; then
            echo '::error::Forecast artifact does not contain v6_daily.db'
            exit 2
          fi
          echo "path=$DB" >> "$GITHUB_OUTPUT"

      - name: Run causal 1-minute backtest and parameter grid
        run: |
          python scripts/backtest_us_open_confirmation.py \
            --v6-db '${{ steps.db.outputs.path }}' \
            --output open_confirmation_backtest.json

      - name: Compare conservative parameter sets
        run: |
          python scripts/probe_us_open_conservative.py \
            --v6-db '${{ steps.db.outputs.path }}' \
            --output open_confirmation_conservative_probe.json

      - name: Evaluate exact production V2 guard implementation
        id: v2-probe
        continue-on-error: true
        run: |
          python scripts/probe_us_open_v2.py \
            --v6-db '${{ steps.db.outputs.path }}' \
            --output open_confirmation_v2_probe.json

      - name: Benchmark WAIT_BETTER_ENTRY versus immediate buy
        if: ${{ always() && steps.db.outputs.path != '' }}
        run: |
          python scripts/backtest_wait_better_entry.py \
            --v6-db '${{ steps.db.outputs.path }}' \
            --years 3 \
            --transaction-cost-bps 10 \
            --output wait_better_entry_backtest.json

      - name: Validate WAIT benchmark evidence
        if: ${{ always() && steps.db.outputs.path != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s wait_better_entry_backtest.json
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('wait_better_entry_backtest.json')
          payload=json.loads(path.read_text(encoding='utf-8'))
          required={
              'requested_years','wait_samples','three_year_requirement_met',
              'promotion_checks','decision','immediate_buy','wait_better_entry',
              'alpha_wait_vs_immediate_pct','better_entry_hit_rate',
              'avg_price_improvement_pct','avg_wait_minutes'
          }
          missing=sorted(required-payload.keys())
          if missing:
              raise SystemExit(f'WAIT benchmark missing required fields: {missing}')
          if int(payload['requested_years']) != 3:
              raise SystemExit(f"WAIT benchmark requested_years={payload['requested_years']} != 3")
          print('WAIT benchmark evidence PASS')
          print(json.dumps({k:payload.get(k) for k in [
              'wait_samples','three_year_requirement_met','better_entry_hit_rate',
              'avg_price_improvement_pct','avg_wait_minutes',
              'alpha_wait_vs_immediate_pct','decision'
          ]}, sort_keys=True))
          PY

      - name: Enforce production V2 probe
        if: ${{ always() && steps.v2-probe.outcome != 'success' }}
        run: |
          echo '::error::Production V2 guard probe failed.'
          exit 1

      - name: Upload backtest evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: us-open-backtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            open_confirmation_backtest.json
            open_confirmation_conservative_probe.json
            open_confirmation_v2_probe.json
            wait_better_entry_backtest.json
          if-no-files-found: error
          retention-days: 30
