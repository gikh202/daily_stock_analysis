name: 美股开盘确认回测

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/02-us-open-backtest.yml'
      - '.github/workflows/01-us-open-confirmation.yml'
      - '.github/workflows/02b-us-open-research-ledger.yml'
      - 'src/forecasting/**'
      - 'src/v6_daily/engine.py'
      - 'scripts/backtest_us_open_confirmation.py'
      - 'scripts/probe_us_open_conservative.py'
      - 'scripts/probe_us_open_v2.py'
      - 'scripts/run_us_open_confirmation.py'
      - 'scripts/run_us_open_confirmation_v2.py'
      - 'scripts/run_us_open_confirmation_safe.py'
      - 'scripts/run_us_open_timing.py'
      - 'scripts/send_us_open_failure_alert.py'
      - 'scripts/us_open_research_ledger.py'
      - 'scripts/capture_us_open_research.py'
      - 'tests/test_notification_streamlining.py'
      - 'tests/test_us_open_confirmation.py'
      - 'tests/test_us_open_confirmation_v2.py'
      - 'tests/test_us_open_email_delivery_contract.py'
      - 'tests/test_v7_forecast_calibration.py'
      - 'tests/test_v7_intraday_timing.py'
      - 'tests/test_us_open_research_ledger.py'
      - 'tests/test_us_open_policy_probe.py'
      - 'tests/test_us_open_research_workflow_contract.py'

permissions:
  contents: read
  actions: read

jobs:
  backtest-us-open:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pytest python-dotenv

      - name: Validate production-policy, V7 forecast and runtime workflow rules
        run: |
          python -m pytest -q --noconftest \
            tests/test_notification_streamlining.py \
            tests/test_us_open_confirmation.py \
            tests/test_us_open_confirmation_v2.py \
            tests/test_us_open_email_delivery_contract.py \
            tests/test_v7_forecast_calibration.py \
            tests/test_v7_intraday_timing.py \
            tests/test_us_open_research_ledger.py \
            tests/test_us_open_policy_probe.py \
            tests/test_us_open_research_workflow_contract.py

      - name: Find latest successful V6/V7 artifact
        id: prior-v6
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '03-v6-daily.yml',
              branch: 'main',
              status: 'completed',
              per_page: 50,
            });
            const run = (response.data.workflow_runs || [])
              .filter((item) => item.conclusion === 'success')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            if (!run) {
              core.setFailed('No successful close forecast run found on main.');
              return;
            }
            core.info(`Using close forecast run ${run.id} created_at=${run.created_at}`);
            core.setOutput('run_id', String(run.id));

      - name: Download V6/V7 history artifact
        uses: actions/download-artifact@v5
        with:
          pattern: v6-daily-*
          path: prior_v6
          merge-multiple: true
          run-id: ${{ steps.prior-v6.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate forecast database
        id: db
        shell: bash
        run: |
          set -euo pipefail
          DB="$(find prior_v6 -type f -name 'v6_daily.db' -print | head -n 1 || true)"
          if [ -z "$DB" ]; then
            echo '::error::Forecast artifact does not contain v6_daily.db'
            exit 2
          fi
          echo "path=$DB" >> "$GITHUB_OUTPUT"

      - name: Run causal 1-minute backtest and parameter grid
        shell: bash
        run: |
          set +e
          python scripts/backtest_us_open_confirmation.py \
            --v6-db '${{ steps.db.outputs.path }}' \
            --output open_confirmation_backtest.json \
            > open_confirmation_backtest.log 2>&1
          STATUS=$?
          set -e
          cat open_confirmation_backtest.log

          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi

          if grep -Fq 'no causal observations with historical minute bars' open_confirmation_backtest.log; then
            echo '::warning::No matured causal 1-minute observations are currently available; record insufficient_data instead of treating external/history availability as a strategy regression.'
            python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "version": "us-open-backtest-v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "status": "insufficient_data",
              "observation_count": 0,
              "sources": {},
              "promotion_gate": {
                  "required_final_observations": 20,
                  "actual_final_observations": 0,
                  "eligible": False,
                  "reason": "no matured causal observations with available historical minute bars",
              },
          }
          Path("open_confirmation_backtest.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
            exit 0
          fi

          echo "::error::US-open causal backtest failed with exit code $STATUS"
          exit "$STATUS"

      - name: Compare conservative parameter sets
        run: |
          python scripts/probe_us_open_conservative.py \
            --v6-db '${{ steps.db.outputs.path }}' \
            --output open_confirmation_conservative_probe.json

      - name: Evaluate exact production V2 guard implementation
        run: |
          python scripts/probe_us_open_v2.py \
            --v6-db '${{ steps.db.outputs.path }}' \
            --output open_confirmation_v2_probe.json

      - name: Upload backtest evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: us-open-backtest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            open_confirmation_backtest.json
            open_confirmation_conservative_probe.json
            open_confirmation_v2_probe.json
          if-no-files-found: warn
          retention-days: 30
