name: Apply WAIT backtest patch

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_apply_wait_backtest_patch.py'
      - '.github/workflows/zz-apply-wait-backtest-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.head_ref == 'fix/wait-better-entry-backtest' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas yfinance python-dotenv

      - name: Apply source patch
        run: python scripts/_apply_wait_backtest_patch.py

      - name: Validate focused WAIT contracts
        run: |
          python -m py_compile scripts/run_us_open_timing.py scripts/us_open_research_ledger.py scripts/backtest_wait_better_entry.py
          python -m pytest -q --noconftest \
            tests/test_v7_intraday_timing.py \
            tests/test_us_open_research_ledger.py \
            tests/test_wait_better_entry_contract.py

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/run_us_open_timing.py \
            scripts/us_open_research_ledger.py \
            scripts/backtest_wait_better_entry.py \
            tests/test_us_open_research_ledger.py \
            tests/test_wait_better_entry_contract.py \
            docs/CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'No source patch changes to commit.'
            exit 0
          fi
          git commit -m 'fix: close WAIT better-entry backtest loop'
          git push origin HEAD:${{ github.head_ref }}
