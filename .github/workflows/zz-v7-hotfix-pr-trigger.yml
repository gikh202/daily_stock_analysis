name: Apply V7 audit hotfix on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/v7-post-merge-audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/v7-post-merge-audit
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply audited patch embedded in one-shot workflow
        shell: bash
        run: |
          python - <<'EXTRACT'
          from pathlib import Path

          source = Path('.github/workflows/zz-v7-post-merge-hotfix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Targeted validation"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('unable to locate audited patch body')
          body = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          prefix = "          "
          lines = body.splitlines()
          if not lines or any(line.strip() and not line.startswith(prefix) for line in lines):
              raise SystemExit('unexpected embedded patch indentation')
          body = "\n".join(line[len(prefix):] if line.strip() else "" for line in lines) + "\n"
          exec(compile(body, 'v7_post_merge_hotfix', 'exec'), {})
          EXTRACT
      - name: Targeted validation
        shell: bash
        run: |
          python -m pip install -q pytest pandas yfinance python-dotenv
          python -m py_compile \
            src/forecasting/history.py src/forecasting/engine.py src/forecasting/decision.py src/forecasting/timing.py \
            src/v6_daily/engine.py scripts/run_us_open_timing.py scripts/us_open_research_ledger.py scripts/capture_us_open_research.py
          python -m pytest -q --noconftest \
            tests/test_v7_forecast_calibration.py \
            tests/test_v7_intraday_timing.py \
            tests/test_us_open_research_ledger.py \
            tests/test_us_open_research_workflow_contract.py \
            tests/test_notification_streamlining.py
      - name: Commit audited fixes and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/zz-v7-post-merge-hotfix.yml .github/workflows/zz-v7-hotfix-pr-trigger.yml
          git config user.name 'gikh202'
          git config user.email 'gikh202@gmail.com'
          git add -- \
            src/forecasting/history.py \
            src/forecasting/engine.py \
            src/forecasting/decision.py \
            src/forecasting/timing.py \
            src/v6_daily/engine.py \
            scripts/run_us_open_timing.py \
            scripts/us_open_research_ledger.py \
            .github/workflows/02b-us-open-research-ledger.yml \
            tests/test_v7_forecast_calibration.py \
            tests/test_us_open_research_ledger.py \
            tests/test_us_open_research_workflow_contract.py \
            tests/test_notification_streamlining.py \
            docs/v7-forecast-architecture.md \
            docs/us-open-runtime-confirmation.md \
            docs/CHANGELOG.md \
            .github/workflows/zz-v7-post-merge-hotfix.yml \
            .github/workflows/zz-v7-hotfix-pr-trigger.yml
          git diff --cached --check
          git commit -m 'fix: harden V7 forecast and intraday learning'
          git push origin HEAD:fix/v7-post-merge-audit
