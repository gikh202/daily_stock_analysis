name: V6.2 one-shot config registration

on:
  push:
    branches:
      - feature/v6-2-accuracy-lab
    paths:
      - '.github/workflows/99-v6-accuracy-register-config.yml'

permissions:
  contents: write

jobs:
  register-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feature/v6-2-accuracy-lab
          fetch-depth: 0

      - name: Register V6.2 config and changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          env_path = Path('.env.example')
          env_text = env_path.read_text(encoding='utf-8')
          if 'V6_ACCURACY_LAB_COST_BPS=' not in env_text:
              marker = '# ===================================\n# 回测配置（可选）\n# ==================================='
              block = '''# ===================================
# V6.2 Accuracy Lab（美股研究层，可选）
# ===================================
# BUY_SETUP 执行回测往返成本，单位 bps；默认 10 = 0.10%
V6_ACCURACY_LAB_COST_BPS=10
# BUY_SETUP 执行回测最大未来交易日持仓窗口
V6_ACCURACY_LAB_MAX_HOLDING_BARS=20
# Challenger 进入人工晋级研究所需最小“非重叠”成熟样本数
V6_ACCURACY_LAB_PROMOTION_MIN_SAMPLES=100

'''
              if marker not in env_text:
                  raise SystemExit('backtest marker missing in .env.example')
              env_text = env_text.replace(marker, block + marker, 1)
              env_path.write_text(env_text, encoding='utf-8')

          changelog_path = Path('docs/CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = ('- [新功能] V6.2 Accuracy Lab 新增非重叠样本与 Wilson 95% 置信区间、'
                   'BUY_SETUP 保守 OHLC 执行回测、版本化 execution policy、Champion/Challenger shadow、'
                   '严格 no-lookahead 历史回放和每周准确率研究工作流；生产 Champion 不自动调参或晋级。\n')
          if entry not in changelog:
              marker = '## [Unreleased]\n'
              if marker not in changelog:
                  raise SystemExit('[Unreleased] marker missing in docs/CHANGELOG.md')
              changelog = changelog.replace(marker, marker + '\n' + entry, 1)
              changelog_path.write_text(changelog, encoding='utf-8')
          PY

      - name: Commit registration changes
        shell: bash
        run: |
          if git diff --quiet -- .env.example docs/CHANGELOG.md; then
            echo 'No registration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .env.example docs/CHANGELOG.md
          git commit -m 'docs(v6): register V6.2 Accuracy Lab configuration'
          git push origin HEAD:feature/v6-2-accuracy-lab

# one-shot trigger: 2026-08-09
