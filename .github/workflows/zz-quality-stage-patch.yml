name: Temporary quality guardrail stage patch

on:
  push:
    branches:
      - agent/refactor-analysis-reliability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-analysis-reliability
          fetch-depth: 0

      - name: Refactor guardrail stage ordering
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/refactor_quality_stage.py
          python /tmp/refactor_quality_stage.py
          python -m py_compile src/phase_decision_guardrail.py src/data_quality_decision_guardrail.py src/core/pipeline.py
          git diff --check

      - name: Commit provenance refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/phase_decision_guardrail.py src/core/pipeline.py src/data_quality_decision_guardrail.py .github/workflows/zz-quality-stage-patch.yml
          git commit -m "refactor: separate data-quality execution guardrail"
          git push origin HEAD:agent/refactor-analysis-reliability
